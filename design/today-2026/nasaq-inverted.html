<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>نَسَق المقلوب</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* نَسَق (NASAQ) — Copyright (c) 2026 Mohammed S. Ellouh. All rights reserved. */
/* نَسَق المقلوب: يوم الفريق من «أنا بخير» إلى تقرير المانح. هوية نَسَق (عاجي، Teal، زعفران) بنية جديدة.
   التخطيط: رأس بخط زمني للحظات اليوم والربع، ثم مشهد لكل لحظة بعمودين على الحاسوب وعمود على الجوال. */
:root{
  --bg:#F7F6F2; --surface:#FFFFFF; --surface-2:#F1EFE9; --ink:#202A2A; --ink-2:#4A5656; --ink-3:#5E6A6A; --rule:#E2E0D8;
  --teal:#174C4F; --on-teal:#FFFFFF; --teal-soft:#DCEBE9; --saffron:#D6A84F; --saffron-ink:#7A5A16;
  --ok:#2F6B4F; --ok-bg:#E5F0E9; --warn:#8A5A0E; --warn-bg:#F8EFD9; --bad:#9A3B2C; --bad-bg:#F8E6E1; --info:#1F5E77; --info-bg:#E1EEF3;
  --f:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
  --pen:#1E3A8A;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0C1A1B; --surface:#112426; --surface-2:#16302F; --ink:#E8EFEE; --ink-2:#BCCDCB; --ink-3:#9FB3B1; --rule:#24403F;
  --teal:#7CC4BC; --on-teal:#0C1A1B; --teal-soft:#173B3B; --saffron:#E0B865; --saffron-ink:#E9C77E;
  --ok:#8FC9A8; --ok-bg:#17302A; --warn:#E6C06A; --warn-bg:#2E2814; --bad:#F0A08B; --bad-bg:#3A231E; --info:#9AD3E6; --info-bg:#123341; --pen:#9DB8FF; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C1A1B; --surface:#112426; --surface-2:#16302F; --ink:#E8EFEE; --ink-2:#BCCDCB; --ink-3:#9FB3B1; --rule:#24403F;
  --teal:#7CC4BC; --on-teal:#0C1A1B; --teal-soft:#173B3B; --saffron:#E0B865; --saffron-ink:#E9C77E;
  --ok:#8FC9A8; --ok-bg:#17302A; --warn:#E6C06A; --warn-bg:#2E2814; --bad:#F0A08B; --bad-bg:#3A231E; --info:#9AD3E6; --info-bg:#123341; --pen:#9DB8FF; color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.65;padding-block:0 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1240px;margin-inline:auto}

/* الرأس: لحظات اليوم والربع */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--rule)}
@supports not (backdrop-filter:blur(1px)){ .top{background:var(--bg)} }
.top .wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding-block:12px 10px}
.top .wrap > *{min-width:0}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.brand b{font-size:18px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.brand b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--saffron)}
.brand span{color:var(--ink-3);font-size:13px}
.steps{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;list-style:none;margin:0;padding:0}
.steps button{display:grid;gap:0;text-align:start;min-width:132px;border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:6px 12px;cursor:pointer;min-height:48px}
.steps button small{color:var(--ink-3);font-size:12px}
.steps button span{font-weight:600;font-size:14px}
.steps button[aria-current="step"]{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.steps button[aria-current="step"] small{color:inherit;opacity:.85}

/* المشهد */
.scene{padding-block:24px 0;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.claim{display:grid;gap:6px;max-width:80ch}
.claim .k{font-size:13px;color:var(--saffron-ink);font-weight:700}
.claim h1{font-size:clamp(26px,3.4vw,40px);font-weight:700}
.claim p{color:var(--ink-2);font-size:16px}
.cols{display:grid;gap:20px;align-items:start}
@media (min-width:1000px){ .cols{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)} .cols.even{grid-template-columns:1fr 1fr} }
.box{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px;display:grid;gap:12px;min-width:0}
.box > h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.box > h2 small{font-weight:400;color:var(--ink-3);font-size:13px}
.plain{padding:0;border:0;background:transparent}
.note{font-size:13px;color:var(--ink-3)}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:0;border-top:1px solid var(--rule)}
.why div{padding:10px 0;padding-inline-end:16px;border-bottom:1px solid var(--rule);font-size:13.5px;color:var(--ink-2)}
.why b{display:block;color:var(--ink);font-size:12.5px;margin-bottom:2px}

/* عناصر مشتركة */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.btn.big{min-height:60px;font-size:17px;padding:12px 22px;border-radius:14px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13px;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)} .pill.mute{background:var(--surface-2);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);border-radius:999px;padding:1px 10px;font-size:12.5px;color:var(--ink-2);background:var(--surface);cursor:pointer;min-height:28px}
.chip[aria-pressed="true"]{border-color:var(--teal);color:var(--teal);font-weight:600}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal);font-weight:700;flex:none}
select,input[type=text],textarea{border:1px solid var(--ink-3);border-radius:8px;background:var(--surface);min-height:40px;padding:6px 10px;width:100%}
textarea{min-height:90px;line-height:1.7}
label.f{display:grid;gap:4px;font-size:13px;color:var(--ink-2);font-weight:600}
.toast{position:fixed;z-index:30;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:520px;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.25)}

/* 1) الصباح: غرفة الفريق */
.me{display:grid;gap:12px}
.me .q{font-size:22px;font-weight:700}
.team{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.team li{border:1px solid var(--rule);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.team li[data-alert="true"]{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.team li[data-help="true"]{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.team .who{display:flex;gap:10px;align-items:center}
.team .who b{display:block}
.team .who span{font-size:12.5px;color:var(--ink-3)}
.clock{display:flex;gap:6px;flex-wrap:wrap}
.clock button{min-height:36px}
.clock button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.risk{list-style:none;margin:0;padding:0;display:grid;gap:0}
.risk li{padding:10px 0;border-bottom:1px solid var(--rule);display:grid;gap:4px}
.risk li:last-child{border-bottom:0}

/* 2) الوعود */
.graph{width:100%;height:auto;display:block}
.plist{list-style:none;margin:0;padding:0;display:grid}
.plist li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.plist .t{font-weight:600}
.plist .s{grid-column:2 / -1;font-size:12.5px;color:var(--ink-3)}
.chain{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:c}
.chain li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:8px 0;position:relative}
.chain li::before{counter-increment:c;content:counter(c);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.chain li[data-weak="true"]::before{background:var(--warn);color:var(--bg)}
.chain li:not(:last-child)::after{content:"";position:absolute;inset-inline-start:13px;top:36px;bottom:-6px;border-inline-start:2px dotted var(--rule)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-inline-end:6px}

/* 3) الورقة */
.paper{background:#FBF8F0;color:#1F2324;border:1px solid #D9D2BF;border-radius:6px;box-shadow:0 1px 0 #E7E0CC,0 16px 36px rgba(40,30,10,.14);padding:18px 18px 14px;position:relative;display:grid;gap:10px;max-width:560px;justify-self:center;width:100%}
.paper .fid{position:absolute;width:14px;height:14px;background:#1F2324}
.paper .fid.a{top:8px;right:8px}.paper .fid.b{top:8px;left:8px}.paper .fid.c{bottom:8px;right:8px}.paper .fid.d{bottom:8px;left:8px}
.paper header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-inline:20px;font-size:13px}
.paper header b{font-size:16px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid #DDD5C2;padding-top:8px}
.prow .pt{font-size:14px;line-height:1.45}
.prow .pt small{display:block;color:#5A5E5F;font-size:12px}
.boxes{display:flex;gap:6px;align-items:center}
.pb{width:40px;height:40px;border:1.6px solid #1F2324;background:#fff;border-radius:3px;display:grid;place-items:center;cursor:pointer;padding:0;position:relative}
.pb svg{width:30px;height:30px;overflow:visible}
.pb .lbl{position:absolute;top:-15px;font-size:10px;color:#5A5E5F}
.codes{display:flex;gap:3px;margin-inline-start:4px}
.cb{width:24px;height:28px;border:1.2px solid #1F2324;background:#fff;border-radius:2px;font-size:11px;cursor:pointer;padding:0;display:grid;place-items:end center;position:relative;color:#5A5E5F}
.cb svg{position:absolute;inset:0;width:100%;height:100%}
.paper footer{font-size:11.5px;color:#5A5E5F;padding-inline:20px;display:flex;flex-wrap:wrap;gap:4px 12px;border-top:1px dashed #CFC6B0;padding-top:8px}
.scanline{position:absolute;inset-inline:0;height:3px;background:linear-gradient(90deg,transparent,#2F8F7F,transparent);top:0;animation:scan 1.1s linear 1;pointer-events:none}
@keyframes scan{from{top:0}to{top:100%}}
.recon{list-style:none;margin:0;padding:0;display:grid}
.recon li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}

/* 4) الرواية */
.trace{list-style:none;margin:0;padding:0;display:grid}
.trace li{display:grid;grid-template-columns:62px 92px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13.5px;align-items:start}
.trace li[data-hl="true"]{background:color-mix(in srgb,var(--saffron) 16%,transparent);margin-inline:-8px;padding-inline:8px;border-radius:6px}
.trace .src{font-size:12px;color:var(--ink-3)}
.trace li[data-new="true"]{animation:fadein .6s ease}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}}
.story{display:grid;gap:12px}
.sent{border:1px solid var(--rule);border-radius:12px;padding:14px;display:grid;gap:8px}
.sent[data-off="true"]{opacity:.5}
.sent p{font-size:16.5px;line-height:1.9}
.sent .tags{display:flex;flex-wrap:wrap;gap:6px}
.sent .acts{display:flex;flex-wrap:wrap;gap:6px}
.approved{border:1px solid var(--ok);background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:12px 14px;font-weight:600}

/* 5) الربع */
.heat{display:grid;grid-template-columns:repeat(31,minmax(0,1fr));gap:3px;direction:rtl}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--surface-2);display:block}
.heat i[data-v="1"]{background:color-mix(in srgb,var(--teal) 45%,var(--surface-2))}
.heat i[data-v="2"]{background:var(--teal)}
.heat i[data-today="true"]{outline:2px solid var(--saffron);outline-offset:1px}
.heat i[data-off="true"]{background:transparent;border:1px dashed var(--rule)}
.rep{display:grid;gap:18px}
.rep section{display:grid;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.rep h3{font-size:16px}
.rep p{font-size:15.5px;line-height:1.95}
.cite{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--rule);border-radius:999px;padding:0 8px;background:var(--surface-2);cursor:pointer;vertical-align:middle;min-height:24px;color:var(--ink-2)}
.flag{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px}
.srcs{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13.5px}
.srcs li{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:6px 8px;background:var(--surface-2);border-radius:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.kpis div{border:1px solid var(--rule);border-radius:12px;padding:10px 12px;display:grid}
.kpis b{font-size:24px;font-variant-numeric:tabular-nums}
.kpis span{font-size:12.5px;color:var(--ink-3)}

/* 6) المانح والمستفيد */
.donor{border:1px solid var(--rule);border-radius:16px;overflow:hidden;background:var(--surface)}
.donor .dh{background:var(--teal);color:var(--on-teal);padding:14px 18px;display:grid;gap:2px}
.donor .dh small{opacity:.85}
.donor .db{padding:16px 18px;display:grid;gap:14px}
.bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:5px}
.hidden-row{border:1px dashed var(--bad);border-radius:10px;padding:10px 12px;color:var(--ink-2);font-size:13.5px;background:var(--bad-bg)}
.fam{list-style:none;margin:0;padding:0;display:grid}
.fam li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:center}
.fam code{font-family:var(--mono);font-size:13px;direction:ltr;unicode-bidi:isolate}
.steps3{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--ink-3)}
.steps3 span{padding:1px 8px;border-radius:999px;border:1px solid var(--rule)}
.steps3 span[data-on="true"]{background:var(--teal-soft);color:var(--teal);border-color:transparent;font-weight:600}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>

<body>
<div class="page" dir="rtl" lang="ar">
<header class="top"><div class="wrap">
  <div class="brand"><b>نَسَق المقلوب</b><span id="date"></span><span>نموذج تفاعلي للرهانات الخمسة | البيانات وهمية</span></div>
  <nav aria-label="لحظات اليوم والربع"><ol class="steps" id="steps"></ol></nav>
</div></header>
<main class="wrap scene" id="scene" aria-live="off"></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<script>
/* نَسَق (NASAQ) — Copyright (c) 2026 Mohammed S. Ellouh. All rights reserved. */
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const M = (h, m) => h * 60 + m;
const LOC = 'ar-EG-u-nu-latn';
const fmt = n => Number(n).toLocaleString(LOC);
function t12(m){ m = ((Math.round(m) % 1440) + 1440) % 1440; let h = Math.floor(m / 60), mi = m % 60; const s = h < 12 ? 'ص' : 'م'; h = h % 12 || 12; return h + ':' + String(mi).padStart(2, '0') + ' ' + s; }
function dur(m){ m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60), r = m % 60; if(!h) return r + ' د'; return h + ' س' + (r ? ' ' + r + ' د' : ''); }
const TODAY = new Date(2026, 9, 21);
const dayLbl = off => { const d = new Date(TODAY); d.setDate(d.getDate() + off); return off === 0 ? 'اليوم' : off === 1 ? 'غدًا' : d.toLocaleDateString(LOC, {weekday: 'long', day: 'numeric', month: 'long'}); };
function hijri(d){ try{ const f = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn', {day: 'numeric', month: 'long', year: 'numeric'}); return f.resolvedOptions().calendar === 'islamic-umalqura' ? f.format(d) : ''; }catch(e){ return ''; } }
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let toastT = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4200); }

/* ---------------- النظام الواحد: الناس والوعود والآثار ---------------- */
const P = {
  me: {n: 'أنت', role: 'المالك', a: 'م'}, rana: {n: 'رنا', role: 'مديرة مشروع الدعم النفسي', a: 'ر'}, samer: {n: 'سامر', role: 'المالي', a: 'س'},
  ahmad: {n: 'أحمد', role: 'منسّق ميداني', a: 'أ'}, heba: {n: 'هبة', role: 'إدارية ومسؤولة السلامة', a: 'ه'}, layla: {n: 'ليلى', role: 'منسّقة ميدانية', a: 'ل'},

};

/* ================= 5) الربع: التقرير يكتب نفسه ================= */
function corpus(){
  const r = rng(1448), days = []; const start = new Date(2026, 6, 1);
  for(let i = 0; i < 92; i++){
    const d = new Date(start); d.setDate(d.getDate() + i);
    if(d.getDay() === 5) continue;
    const narrated = r() < .82; if(!narrated){ days.push({d, narrated: false}); continue; }
    const sessions = Math.floor(r() * 4), att = sessions ? sessions * (8 + Math.floor(r() * 8)) : 0;
    const dist = r() < .22 ? 20 + Math.floor(r() * 40) : 0, conf = dist ? Math.max(0, dist - Math.floor(r() * 7)) : 0;
    const power = r() < .2, road = r() < .09, sec = r() < .05;
    const s = [];
    if(sessions) s.push(sessions === 1 ? `نُفّذت جلسة دعم نفسي واحدة في مركز الإيواء (${att} حضورًا).` : `نُفّذت ${sessions} ${sessions === 2 ? 'جلستا' : 'جلسات'} دعم نفسي في مركز الإيواء (${att} حضورًا).`);
    if(dist) s.push(`وُزّعت طرود على ${dist} أسرة، وأكدت ${conf} منها الاستلام.`);
    if(road) s.push('تعذّرت الزيارات الميدانية لإغلاق الطريق.');
    if(power) s.push('انقطعت الكهرباء معظم النهار، فأُجّلت الجلسة المسائية.');
    if(sec) s.push('عُلّق العمل الميداني لوضع أمني، وتأكد الفريق كله أنه بخير.');
    if(!s.length) s.push('عمل مكتبي: متابعة الاستمارات وتحديث السجلات.');
    days.push({d, narrated: true, sessions, att, dist, conf, power, road, sec, s});
  }
  return days;
}

  <div class="cols">

      <p>كل فقرة تنتهي بزر «من N يومًا». اضغطه لترى جمل الأيام التي بُنيت عليها الفقرة، بتواريخها.</p>
      <p>لا يضيف نَسَق رقمًا لا أصل له في الروايات المعتمدة. وحين يختلط معنيان (حضور مقابل أطفال، أو توزيع مقابل استلام)، يضع تنبيهًا بدل أن يختار عنك.</p>
      <p class="note">البيانات هنا محاكاة لربع كامل (${C.length} يوم عمل) بمولّد ثابت، لتبيان الآلية لا النتائج.</p></div>
  </div>`
  + why([['ما يتغير في المنتج', 'التقرير الربعي ليس مهمة تبدأ قبل الموعد بأسبوع، بل ناتج جانبي لروايات الأيام.'], ['على بنيتنا', 'التجميع والأرقام محلية. الصياغة السردية بقوالب أو بنموذج لغوي بمفتاح المنظمة.'], ['الخطر', 'مسودة مقنعة تُرسل دون مراجعة. لذلك تنبيهات صريحة، ولا يُصدَّر شيء دون اعتماد بشري.'], ['كيف نختبره', 'ربع واحد على منحة واحدة: كم ساعة استغرقت المراجعة مقابل الكتابة من الصفر؟']]);
}

/* ================= 6) المانح والمستفيد ================= */
function donorView(){
  const conf = ST.fams.filter(f => f[2] === 2).length, del = ST.fams.filter(f => f[2] >= 1).length;
  const shared = (ST.sent || buildSentences()).filter(s => s.share && s.on);
  const isRafd = ST.donor === 'rafd';
  const dpage = `<div class="donor"><div class="dh"><b>${isRafd ? 'مؤسسة الرفد | الطرود الصحية' : 'صندوق غِراس | الدعم النفسي'}</b><small>صفحة حيّة للقراءة فقط | آخر تحديث: اليوم 8:41 م</small></div>
    <div class="db">${isRafd ? `<div><div class="row" style="justify-content:space-between"><b>الدفعة 2: أسر أكدت الاستلام</b><span class="num">${conf} من ${ST.fams.length}</span></div><div class="bar"><i style="width:${conf / ST.fams.length * 100}%"></i></div><p class="note">نعرض المؤكَّد من الأسرة فقط. سُلّم ${del} طردًا بحسب الموزّعين.</p></div>`
      : `<div><div class="row" style="justify-content:space-between"><b>جلسات الربع الرابع</b><span class="num">31 من 180 مخطّطة</span></div><div class="bar"><i style="width:17%"></i></div></div>`}
      <div><b>من يوم العمل (جمل اعتمدها الفريق للمشاركة)</b>${shared.filter(s => (isRafd ? s.proj === 'kits' : s.proj === 'psy')).map(s => `<p style="margin-top:6px">${esc(s.text)}</p>`).join('') || '<p class="note">لا جمل مشتركة اليوم.</p>'}</div>
      ${ST.showHidden ? `<div class="hidden-row"><b>لا يراه المانح:</b> أسماء الموظفين، ورموز الأسر، وأسباب التعذّر التفصيلية، ومناطق تحرّك الفريق، والجمل الموسومة «داخلية فقط».</div>` : ''}</div></div>`;
  return claim('الافتراض المكسور: المنتج ينتهي عند حدود المنظمة', 'المانح يرى العمل حيًّا، و«تمّت» تعني أن الأسرة أكدت', 'بدل التقرير الشهري، صفحة حيّة للقراءة يختار المالك ما يظهر فيها. ومن الجهة الأخرى، التوزيع لا ينتهي حين يضغط الموظف «تمّ»، بل حين تؤكد الأسرة بمسح رمز على الطرد أو بتوقيع على الكشف يُصوَّر.')
  + `<div class="cols even">
    <div class="box"><h2>ما يراه المانح</h2>
      <div class="row" role="group" aria-label="المانح"><button class="chip" type="button" data-a="donor:rafd" aria-pressed="${isRafd}">مؤسسة الرفد</button><button class="chip" type="button" data-a="donor:gharas" aria-pressed="${!isRafd}">صندوق غِراس</button>
        <button class="chip" type="button" data-a="hidden" aria-pressed="${ST.showHidden}">اكشف ما لا يراه</button></div>${dpage}</div>
    <div class="box"><h2>تأكيد الاستلام | الدفعة 2، مركز الرمال <small class="num">${conf} من ${ST.fams.length} مؤكدة</small></h2>
      <ul class="fam">${ST.fams.map(([code, size, st], i) => `<li><div><code>${code}</code> <span class="note">${size} أفراد</span>
        <div class="steps3" aria-label="مراحل"><span data-on="${st >= 0}">مسجّلة</span><span data-on="${st >= 1}">سُلّم</span><span data-on="${st >= 2}">أكدت الأسرة</span></div></div>
        <div>${st === 0 ? `<button class="btn sm" type="button" data-a="fam:${i}">سجّل التسليم</button>` : st === 1 ? `<button class="btn sm primary" type="button" data-a="fam:${i}">امسح رمز الطرد مع الأسرة</button>` : '<span class="pill ok">مؤكَّد</span>'}</div></li>`).join('')}</ul>
      <p class="note">الأسر برموز لا بأسماء، حتى داخل الفريق في هذه الشاشة. الأسماء في سجل التسجيل المحمي فقط.</p></div>
  </div>
  <div class="flag" role="note">لا يُبنى هذا الجزء قبل سياسة لحماية بيانات المستفيدين، توافق عليها المنظمة وتُراجع مع المانحين: ما يُجمع، ومن يراه، وكم يُحفظ.</div>`
  + why([['ما يتغير في المنتج', 'تعريف «تمّت» للتوزيع يصبح تأكيد الأسرة. والمانح يقرأ صفحة بدل انتظار تقرير.'], ['على بنيتنا', 'صفحة المانح: عرض للقراءة يولّده الجسر برابط خاص. المسح: رمز QR مطبوع على الطرد. التوقيع المصوَّر بديل لمن لا هاتف معه.'], ['الخطر', 'هو الأعلى: تسريب بيانات أسر في سياق نزاع. أعداد مجمّعة فقط للمانح، ولا أسماء خارج سجل التسجيل.'], ['كيف نختبره', 'دفعة توزيع واحدة: كم من الأسر أكد فعلًا؟ وهل يقبل المانح الصفحة بديلًا عن تقرير شهري؟']]);
}

/* ---------------- العرض والأحداث ---------------- */
function render(){
  const v = ST.view;
  $('#scene').innerHTML = v === 'ops' ? opsView() : v === 'promises' ? promisesView() : v === 'paper' ? paperView() : v === 'story' ? storyView() : v === 'quarter' ? quarterView() : donorView();
  $('#scene').innerHTML += `<nav class="row" style="justify-content:space-between;margin-top:8px" aria-label="التالي والسابق">${(() => { const i = STEPS.findIndex(s => s[0] === v); return (i > 0 ? `<button class="btn" type="button" data-step="${STEPS[i - 1][0]}">→ ${STEPS[i - 1][2]}</button>` : '<span></span>') + (i < STEPS.length - 1 ? `<button class="btn primary" type="button" data-step="${STEPS[i + 1][0]}">${STEPS[i + 1][2]} ←</button>` : ''); })()}</nav>`;
}
function onClick(e){
  const st = e.target.closest('[data-step]'); if(st){ go(st.dataset.step); return; }
  const node = e.target.closest('[data-node]'); if(node){ ST.focus = ST.focus === node.dataset.node ? null : node.dataset.node; render(); return; }
  const mk = e.target.closest('[data-mark]'); if(mk){ const [i, k] = mk.dataset.mark.split(':'); const r = ST.card[+i]; r.m = r.m === k ? null : k; if(r.m !== 'no') r.c = null; ST.scanned = false; render(); const again = $(`[data-mark="${i}:${k}"]`); if(again) again.focus(); return; }
  const cb = e.target.closest('[data-code]'); if(cb){ const [i, j] = cb.dataset.code.split(':').map(Number); ST.card[i].c = ST.card[i].c === j ? null : j; ST.scanned = false; render(); const again = $(`[data-code="${i}:${j}"]`); if(again) again.focus(); return; }
  const ci = e.target.closest('[data-cite]'); if(ci){ ST.cite = ST.cite === ci.dataset.cite ? null : ci.dataset.cite; render(); const again = $(`[data-cite="${ci.dataset.cite}"]`); if(again) again.focus(); return; }
  const b = e.target.closest('[data-a]'); if(!b) return;
  const [a, x] = b.dataset.a.split(':');
  const keep = b.dataset.a;
  switch(a){
    case 'clock': ST.clock = x; break;
    case 'ok-office': ST.check.me = {t: CLOCKS[ST.clock], z: 'المكتب'}; toast('سُجّلت: بخير في المكتب'); break;
    case 'ok-field': ST.check.me = {t: CLOCKS[ST.clock], z: $('#zone').value}; toast('سُجّلت: بخير في الميدان | ' + $('#zone').value); break;
    case 'help': ST.help = 'me'; toast('أُرسل طلب المساعدة إلى هبة وإليك'); break;
    case 'unhelp': ST.help = null; break;
    case 'recheck': ST.check.me = null; break;
    case 'verify': ST.verified[x] = t12(CLOCKS[ST.clock]) + ' هاتفيًا'; toast(P[x].n + ': سُجّل أنك تحقّقت هاتفيًا'); break;
    case 'ask': toast('أُرسل إلى ' + P[x].n + ': «صباح الخير، طمّنّا عنك»'); break;
    case 'unstick': toast('اقتراح: نقل زيارتي مركز الإيواء إلى الغد، وإبلاغ رنا. لا شيء يتغير دون موافقة أحمد'); break;
    case 'goto': go(x); return;
    case 'unfocus': ST.focus = null; break;
    case 'neg': { const p3 = ST.promises.find(p => p.id === 'p3'), p4 = ST.promises.find(p => p.id === 'p4'); const d = +x;
      p3.due = d; p3.st = 'ok'; p3.note = 'سامر قبِل: ' + dayLbl(d); p4.st = d >= 3 ? 'risk' : 'ok'; p4.note = d >= 3 ? 'بلا هامش بعد تأجيل المطابقة' : ''; toast(d >= 3 ? 'المطابقة يوم السبت: صار إرسال الأحد بلا هامش' : 'اتُّفق مع سامر. الإرسال يوم الأحد بهامش'); break; }
    case 'newp': { const t = $('#np-t').value.trim(), to = $('#np-to').value, d = +$('#np-d').value;
      if(!t || !to){ toast(!t ? 'اكتب ما تعِد به' : 'لا يُحفظ وعد بلا طرف ثانٍ: اختر لمن'); return; }
      ST.promises.push({id: 'n' + Date.now(), from: 'me', to, t, due: d, st: 'ok', proj: P[to].ext && to === 'rafd' ? 'kits' : 'psy', note: 'بانتظار قبول ' + P[to].n}); toast('أُرسل الوعد إلى ' + P[to].n + ' ليقبله أو يفاوض عليه'); break; }
    case 'scan': ST.scanning = true; render(); setTimeout(() => { ST.scanning = false; ST.scanned = true;
        const p8 = ST.promises.find(p => p.id === 'p8'); if(ST.card[5].m === 'ok'){ p8.st = 'done'; p8.note = 'من البطاقة الورقية'; }
        const blocked = ST.card.find(r => r.m === 'no' && r.c === 1); if(blocked) ST.stuck.ahmad = 'طريق مغلق (من بطاقته)';
        render(); toast('قُرئت البطاقة: تحدّثت الرواية والوعود وغرفة الفريق'); }, 1150); return;
    case 'edit': { const s = [...ST.sent, ...ST.extra].find(q => q.id === x); s.editing = true; render(); const t = $('#ed-' + x); if(t) t.focus(); return; }
    case 'save': { const s = [...ST.sent, ...ST.extra].find(q => q.id === x); s.text = $('#ed-' + x).value; s.editing = false; s.edited = true; ST.approved = false; break; }
    case 'toggle': { const s = [...ST.sent, ...ST.extra].find(q => q.id === x); s.on = !s.on; ST.approved = false; break; }
    case 'share': { const s = [...ST.sent, ...ST.extra].find(q => q.id === x); s.share = !s.share; break; }
    case 'from': ST.hl = ST.hl === x ? null : x; break;
    case 'addx': { const v = $('#addx').value.trim(); if(!v){ toast('اكتب ما لم يُرصد'); return; } ST.extra.push({id: 'x' + Date.now(), on: true, proj: 'manual', share: false, ind: ['أضفتَها بنفسك'], text: v}); ST.approved = false; break; }
    case 'approve': ST.approved = true; toast('اعتُمدت رواية اليوم وأُضيفت إلى سجل الربع'); break;
    case 'copyrep': { const txt = $$('.rep section').map(s => s.querySelector('h3').textContent + '\n' + s.querySelector('p').textContent.replace(/من \d+ يومًا.*$/, '').trim()).join('\n\n');
      try{ navigator.clipboard.writeText(txt).then(() => toast('نُسخت المسودة'), () => toast('تعذّر النسخ. حدّد النص يدويًا')); }catch(err){ toast('تعذّر النسخ. حدّد النص يدويًا'); } return; }
    case 'donor': ST.donor = x; break;
    case 'hidden': ST.showHidden = !ST.showHidden; break;
    case 'fam': { const f = ST.fams[+x]; f[2] = Math.min(2, f[2] + 1); toast(f[2] === 2 ? 'أكدت الأسرة ' + f[0] + ' الاستلام. تحدّثت صفحة المانح' : 'سُجّل التسليم. يبقى تأكيد الأسرة'); break; }
  }
  render();
  const again = document.querySelector(`[data-a="${CSS.escape(keep)}"]`); if(again && !again.disabled) again.focus({preventScroll: true});
}
function init(){
  const h = hijri(TODAY); $('#date').textContent = 'الأربعاء 21 أكتوبر 2026' + (h ? ' | ' + h : '');
  renderSteps(); render();
  document.addEventListener('click', onClick);
  document.addEventListener('keydown', e => { const n = e.target.closest && e.target.closest('[data-node]'); if(n && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); ST.focus = ST.focus === n.dataset.node ? null : n.dataset.node; render(); const again = $(`[data-node="${n.dataset.node}"]`); if(again) again.focus(); } });
}
document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', init) : init();

</script>
</body>
</html>
