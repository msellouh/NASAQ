/* المختبر: إطار الصفحة (يتبع ثيم المشاهد) + التطبيق داخل جهاز (يتبع الطابع المختار في النموذج).
   التخطيط: شريط تحكّم لاصق، ثم مسرح يحمل جهازًا بعرضه الحقيقي مصغّرًا ليناسب، أو الدراسة بعمود قراءة وفهرس. */
:root{
  --c-bg:#EFEEE9; --c-surface:#FFFFFF; --c-text:#1D2626; --c-text-2:#46514F; --c-border:#D9D6CC;
  --c-ink:#174C4F; --c-on-ink:#FFFFFF; --c-saffron:#B98A2E; --c-saffron-dot:#D6A84F; --c-focus:#2F6F6B;
  --c-font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --c-shadow:0 1px 2px rgba(23,76,79,.06),0 12px 32px rgba(23,76,79,.10);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --c-bg:#0C1213; --c-surface:#131B1C; --c-text:#E5ECEB; --c-text-2:#A8B6B4; --c-border:#253032;
  --c-ink:#7CC4BC; --c-on-ink:#0C1213; --c-saffron:#E0B865; --c-saffron-dot:#E0B865; --c-focus:#7CC4BC;
  --c-shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --c-bg:#0C1213; --c-surface:#131B1C; --c-text:#E5ECEB; --c-text-2:#A8B6B4; --c-border:#253032;
  --c-ink:#7CC4BC; --c-on-ink:#0C1213; --c-saffron:#E0B865; --c-saffron-dot:#E0B865; --c-focus:#7CC4BC;
  --c-shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.45); color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--c-bg);color:var(--c-text);font-family:var(--c-font);font-size:14px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--c-bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c-focus);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lab-ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* ---------- شريط التحكّم ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:10px;background:color-mix(in srgb,var(--c-bg) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--c-border)}
@supports not (backdrop-filter:blur(1px)){ .bar{background:var(--c-bg)} }
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;max-width:1500px;margin-inline:auto}
.lab-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-inline-end:auto;white-space:nowrap}
.lab-brand .dot{width:8px;height:8px;border-radius:50%;background:var(--c-saffron-dot)}
.lab-brand small{font-weight:400;color:var(--c-text-2);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--c-border);border-radius:10px;padding:2px;background:var(--c-surface);gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;min-height:32px;cursor:pointer;color:var(--c-text-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--c-ink);color:var(--c-on-ink);font-weight:600}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.ctl label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--c-text-2)}
.ctl select{border:1px solid var(--c-border);background:var(--c-surface);border-radius:8px;min-height:32px;padding:4px 8px;max-width:190px}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--c-border);background:var(--c-surface);border-radius:8px;min-height:32px;padding:4px 10px;cursor:pointer;font-size:13px}
.tbtn[aria-pressed="true"]{border-color:var(--c-ink);color:var(--c-ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--c-ink)}
.ctl-more{display:contents}
.ctl-more>summary{display:none}
@media (max-width:760px){
  .ctl-more{display:block;width:100%}
  .ctl-more>summary{display:flex;align-items:center;gap:6px;cursor:pointer;min-height:36px;color:var(--c-text-2);font-size:13px;list-style:none}
  .ctl-more>summary::-webkit-details-marker{display:none}
  .ctl-more[open]>.ctl{padding-block:8px 4px}
  .ctl label{flex:1 1 44%}
  .ctl select{max-width:none;width:100%}
}
.hint{max-width:1500px;margin:10px auto 0;color:var(--c-text-2);font-size:13px}
.hint kbd{font-family:inherit;border:1px solid var(--c-border);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--c-surface);font-size:12px}

/* ---------- المسرح والجهاز ---------- */
.stage-wrap{max-width:1500px;margin:14px auto 0}
.stage{position:relative;width:100%}
.device{position:absolute;top:0;inset-inline-start:0;transform-origin:top right;border-radius:14px;overflow:hidden;
  box-shadow:var(--c-shadow);border:1px solid var(--c-border);background:var(--c-surface)}
.device[data-device="desktop"]{width:1440px;height:900px}
.device[data-device="mobile"]{box-sizing:content-box;width:390px;height:844px;border-radius:44px;border:10px solid #111615}
.stage-cap{display:flex;justify-content:space-between;gap:12px;color:var(--c-text-2);font-size:12px;margin-top:8px;flex-wrap:wrap}

/* ---------- لوحة «لماذا» ---------- */
.why-drawer{position:fixed;z-index:40;inset-block:calc(env(safe-area-inset-top,0px) + 64px) 16px;inset-inline-end:max(16px,env(safe-area-inset-left,0px));width:min(380px,calc(100% - 32px));
  background:var(--c-surface);border:1px solid var(--c-border);border-radius:14px;box-shadow:var(--c-shadow);display:flex;flex-direction:column;overflow:hidden}
.why-drawer header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--c-border)}
.why-drawer h2{margin:0;font-size:16px}
.why-list{overflow:auto;padding:8px 16px 16px;overscroll-behavior:contain}
.why-item{padding:12px 0;border-bottom:1px solid var(--c-border)}
.why-item[data-on="true"]{background:color-mix(in srgb,var(--c-saffron-dot) 14%,transparent);margin-inline:-16px;padding-inline:16px}
.why-item h3{margin:0 0 4px;font-size:14px;display:flex;gap:8px;align-items:baseline}
.why-item h3 b{font-variant-numeric:tabular-nums;color:var(--c-saffron);min-width:18px}
.why-item p{margin:0 0 6px;color:var(--c-text);font-size:13px}
.why-item .src{font-size:12px;color:var(--c-text-2)}
.grade{display:inline-block;border:1px solid var(--c-border);border-radius:6px;padding:0 6px;font-size:12px;margin-inline-start:4px;white-space:nowrap}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:inherit}
.icon-btn:hover{border-color:var(--c-border)}
@media (max-width:760px){ .why-drawer{inset-block:auto 0;inset-inline:0;width:auto;max-height:70vh;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)} }

/* ---------- الدراسة ---------- */
.study{display:grid;grid-template-columns:minmax(0,1fr);gap:32px;max-width:1240px;margin:20px auto 0}
@media (min-width:1080px){ .study{grid-template-columns:260px minmax(0,1fr)} }
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;max-height:calc(100vh - 100px);overflow:auto;font-size:13px;padding-inline-end:8px}
.toc a{display:block;color:var(--c-text-2);text-decoration:none;padding:5px 0;border-bottom:1px solid var(--c-border)}
.toc a:hover{color:var(--c-ink)}
@media (max-width:1079px){ .toc{position:static;max-height:none;columns:2;column-gap:24px} .toc a{break-inside:avoid} }
@media (max-width:560px){ .toc{columns:1} }
.doc{min-width:0;background:var(--c-surface);border:1px solid var(--c-border);border-radius:14px;padding:clamp(18px,4vw,44px)}
.doc h1{font-size:clamp(24px,3.4vw,34px);line-height:1.3;margin:0 0 12px;text-wrap:balance}
.doc h2{font-size:22px;margin:40px 0 12px;padding-top:16px;border-top:1px solid var(--c-border);text-wrap:balance;scroll-margin-top:90px}
.doc h3{font-size:17px;margin:28px 0 8px;scroll-margin-top:90px}
.doc p,.doc li{max-width:78ch;line-height:1.85}
.doc ul,.doc ol{padding-inline-start:22px}
.doc li{margin-block:4px}
.doc a{color:var(--c-ink)}
.doc code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:color-mix(in srgb,var(--c-ink) 8%,transparent);padding:1px 5px;border-radius:4px;direction:ltr;unicode-bidi:isolate}
.doc blockquote{margin:12px 0;padding:8px 14px;border-inline-start:3px solid var(--c-saffron-dot);color:var(--c-text-2)}
.tbl{overflow-x:auto;margin:12px 0 18px;border:1px solid var(--c-border);border-radius:10px}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.tbl th,.tbl td{text-align:start;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--c-border);line-height:1.7}
.tbl th{background:color-mix(in srgb,var(--c-ink) 7%,var(--c-surface));font-weight:600;position:sticky;top:0}
.tbl tr:last-child td{border-bottom:0}

/* ---------- التطبيق: رموز الطوابع (القيم من themes/*.css في المستودع) ---------- */
.app{

  --text-1:#202A2A; --text-2:#3E4A4A; --text-3:#5B6868; --border:#E4E4E4; --border-strong:#7F8A8A;
  --primary:#174C4F; --on-primary:#FFFFFF; --primary-hover:#2F6F6B; --primary-text:#174C4F;
  --accent:#D6A84F; --on-accent:#202A2A; --focus-ring:#2F6F6B;
  --success:#4F6E5D; --success-bg:#EAF1EC; --warning:#846428; --warning-bg:#F8F1E2; --danger:#93563F; --danger-bg:#F8ECE8; --info:#174C4F; --info-bg:#DCEBE9;
  --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --font-head:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --head-w:600; --head-scale:1;
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px;
  --elev-1:0 1px 2px rgba(23,76,79,.05); --elev-2:0 1px 2px rgba(23,76,79,.05),0 8px 24px rgba(23,76,79,.07); --elev-3:0 2px 4px rgba(23,76,79,.06),0 16px 40px rgba(23,76,79,.14);
  --overlay:rgba(23,76,79,.28); --motion-scale:1;
  --period-current:color-mix(in srgb,var(--primary) 6%,var(--surface-1));

  --dur-1:110ms; --dur-2:180ms; --dur-3:280ms; --dur-4:420ms;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-std:cubic-bezier(.4,0,.2,1);

}

  --overlay:rgba(0,0,0,.6); --period-current:color-mix(in srgb,var(--primary) 10%,var(--surface-1)); color-scheme:dark;
}
.app[data-palette="classic"]{
  --bg:#F5F0E3; --surface-1:#FBF8EF; --surface-2:#F0EADB; --surface-3:#E8E0CC;
  --text-1:#1E3A6E; --text-2:#3B4A63; --text-3:#5F5B52; --border:#D6CCB4; --border-strong:#7C8AA3;
  --primary:#1E3A6E; --on-primary:#FBF8EF; --primary-hover:#16305D; --primary-text:#1E3A6E;
  --accent:#B3261E; --on-accent:#FBF8EF; --focus-ring:#1E3A6E;
  --success:#2E6B4F; --success-bg:#E3EDE3; --warning:#8A5A00; --warning-bg:#F6EBCB; --danger:#B3261E; --danger-bg:#F7E1DC; --info:#1E3A6E; --info-bg:#E3EAF5;
  --font-head:Amiri,"Traditional Arabic",serif; --head-w:700; --head-scale:1.12;
  --r-sm:2px; --r-md:4px; --r-lg:6px; --r-xl:8px; --elev-1:none; --elev-2:0 0 0 1px var(--border); --elev-3:0 0 0 1px var(--border-strong),0 12px 30px rgba(30,58,110,.12);
  --motion-scale:.6; color-scheme:light;
}

  --bg:#1B1A17; --surface-1:#24221E; --surface-2:#2C2925; --surface-3:#34302B;
  --text-1:#E9E2D2; --text-2:#C8C1B2; --text-3:#B3AC9C; --border:#3A4458; --border-strong:#6E7A92;
  --primary:#8FB0E8; --on-primary:#1B1A17; --primary-hover:#A9C3EF; --primary-text:#8FB0E8;

  --success:#86C7A5; --success-bg:#1F2E27; --warning:#E2B35C; --warning-bg:#332A17; --danger:#F08A7E; --danger-bg:#3A2320; --info:#8FB0E8; --info-bg:#232C3D;
  --elev-2:0 0 0 1px var(--border); --elev-3:0 0 0 1px var(--border-strong),0 16px 40px rgba(0,0,0,.5); --overlay:rgba(0,0,0,.6); color-scheme:dark;
}

  --bg:#EEF1F7; --surface-1:#FFFFFF; --surface-2:#F5F7FB; --surface-3:#E6E9F3;

  --primary:#00B7D4; --on-primary:#14162A; --primary-hover:#009BB5; --primary-text:#006F8C;
  --accent:#00B7D4; --on-accent:#14162A; --focus-ring:#007A99;
  --success:#06744F; --success-bg:#E4F4EE; --warning:#5A3A9E; --warning-bg:#EEE8FA; --danger:#C42B2E; --danger-bg:#FBE8E8; --info:#005F78; --info-bg:#E0F4F8;
  --font-body:"Readex Pro","Segoe UI",Tahoma,sans-serif; --font-head:Alexandria,"Readex Pro",Tahoma,sans-serif; --head-w:700;

  --text-1:#EEF1F7; --text-2:#C4C9DD; --text-3:#9AA1BE; --border:#2C3058; --border-strong:#727692;
  --primary:#00B7D4; --on-primary:#14162A; --primary-hover:#33C5DD; --primary-text:#4FD3EA;
  --accent:#00B7D4; --on-accent:#14162A; --focus-ring:#00B7D4;
  --success:#34F5B5; --success-bg:#10362F; --warning:#C9B5FF; --warning-bg:#2A2350; --danger:#FF6B6E; --danger-bg:#3B1E2A; --info:#7FE3F5; --info-bg:#0F3246;
  --elev-2:0 1px 2px rgba(0,0,0,.35),0 12px 30px rgba(0,0,0,.45); --elev-3:0 0 0 1px var(--border),0 20px 50px rgba(0,0,0,.55); --overlay:rgba(5,6,18,.65);
  --period-current:color-mix(in srgb,var(--primary) 12%,var(--surface-1)); color-scheme:dark;
}

  --text-1:#0F1110; --text-2:#3D413E; --text-3:#4F544F; --border:#E3E0D7; --border-strong:#686D67;
  --primary:#0F1110; --on-primary:#F4F3EE; --primary-hover:#2A2E2B; --primary-text:#0F1110;
  --accent:#855300; --on-accent:#FFFFFF; --focus-ring:#0F1110;

.app.reduced,.app.reduced *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){ .app *{animation:none!important;transition:none!important} }

/* ---------- هيكل التطبيق ---------- */
.app{container:app/inline-size;position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text-1);
  font-family:var(--font-body);font-size:14px;line-height:1.6;text-align:start}
.app h1,.app h2,.app h3{font-family:var(--font-head);font-weight:var(--head-w);margin:0;line-height:1.3}
.app button{cursor:pointer}
.app :focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.app .ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.app .ic.s{width:16px;height:16px}
.num{font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-rows:minmax(0,1fr) auto;height:100%}
.col{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.main{overflow:auto;overscroll-behavior:contain;min-height:0;scroll-padding-top:12px}
.side{display:none}
.skip{position:absolute;inset-inline-start:8px;top:-60px;z-index:50;background:var(--primary);color:var(--on-primary);padding:8px 12px;border-radius:var(--r-md)}
.skip:focus{top:8px}
@container app (min-width:900px){
  .shell{grid-template-rows:none;grid-template-columns:232px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:4px;padding:20px 14px;border-inline-end:1px solid var(--border);background:var(--surface-2);min-height:0}
  .tabs{display:none!important}
}

/* التنقل الجانبي */
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-family:var(--font-head);font-weight:700;font-size:20px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--primary);display:grid;place-items:center;color:var(--on-primary);font-size:15px;position:relative}
.brand-mark::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--accent);inset-block-end:-2px;inset-inline-start:-2px;box-shadow:0 0 0 2px var(--surface-2)}
.nav-item{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 10px;border-radius:var(--r-md);border:0;background:transparent;color:var(--text-2);text-align:start;width:100%;font-size:14px}
.nav-item:hover{background:var(--surface-3);color:var(--text-1)}
.nav-item[aria-current="page"]{background:var(--surface-1);color:var(--text-1);font-weight:600;box-shadow:inset 0 0 0 1px var(--border)}
.nav-item[aria-current="page"] .ic{color:var(--primary-text)}
.nav-item .cnt{margin-inline-start:auto;font-size:12px;color:var(--text-3)}
.side-sep{height:1px;background:var(--border);margin:10px 6px}
.side-capture{margin-top:6px}
.who{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px 8px;border-top:1px solid var(--border);font-size:13px;color:var(--text-2)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--text-1);font-weight:600;font-size:13px;flex:none}

/* الشريط السفلي (جوال) */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;border-top:1px solid var(--border);background:var(--surface-1);
  padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{display:grid;justify-items:center;gap:2px;border:0;background:transparent;color:var(--text-3);font-size:12px;min-height:48px;padding:4px 0}
.tab[aria-current="page"]{color:var(--primary-text);font-weight:600}
.tab[aria-current="page"]::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);margin-bottom:1px}
.tab:not([aria-current="page"])::before{content:"";height:5px;margin-bottom:1px}
.tab-cap{justify-self:center;width:56px;height:56px;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:var(--elev-2);transform:translateY(-10px)}
.tab-cap .ic{width:26px;height:26px}

/* الترويسة */
.top{display:flex;align-items:center;gap:12px;padding:14px 18px 10px;border-bottom:1px solid var(--border);background:var(--bg)}
.top h1{font-size:calc(17px * var(--head-scale));font-weight:var(--head-w)}
.top .hij{color:var(--text-3);font-size:13px}
.top .dates{display:grid;gap:0;min-width:0}
.top .tools{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
@container app (min-width:900px){ .top{padding:18px 32px 14px} .top h1{font-size:calc(20px * var(--head-scale))} }
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;background:var(--surface-1);white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--success)}
.sync[data-s="off"]::before{background:var(--warning)}
.sync[data-s="busy"]::before{background:var(--info);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}

/* الأزرار */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface-1);color:var(--text-1);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--border-strong)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--text-1)}
.btn.lg{min-height:48px;padding:10px 20px;font-size:15px}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px;font-weight:500}
.link{border:0;background:transparent;color:var(--primary-text);font-weight:600;padding:4px 2px;min-height:32px;font-size:13px}
.link:hover{text-decoration:underline}
.ib{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--r-md);border:0;background:transparent;color:var(--text-2)}
.ib:hover{background:var(--surface-3);color:var(--text-1)}

/* ---------- اليوم ---------- */
.today{display:grid;gap:22px;padding:16px 16px 28px}
@container app (min-width:900px){
  .today{grid-template-columns:minmax(0,1fr) 340px;gap:36px;padding:26px 32px 40px;max-width:1220px}
  .today .rail{grid-column:2;grid-row:1 / span 3}
}
.mtabs{display:flex;gap:4px;border:1px solid var(--border);background:var(--surface-2);border-radius:var(--r-lg);padding:3px}
.mtabs button{flex:1;border:0;background:transparent;border-radius:calc(var(--r-lg) - 3px);min-height:40px;color:var(--text-2);font-weight:500}
.mtabs button[aria-selected="true"]{background:var(--surface-1);color:var(--text-1);font-weight:600;box-shadow:var(--elev-1)}
@container app (min-width:900px){ .mtabs{display:none} }

/* «الآن»: العنصر المهيمن الوحيد المرفوع */
.now{position:relative;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--elev-2);padding:20px;display:grid;gap:14px}
@container app (min-width:900px){ .now{padding:28px 32px} }
.now .eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;color:var(--text-2);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--info-bg);color:var(--info)}
.pill.now-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.now h2{font-size:calc(22px * var(--head-scale));line-height:1.35;text-wrap:balance}
@container app (min-width:900px){ .now h2{font-size:calc(30px * var(--head-scale))} }
.now .meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--text-2);font-size:13px}
.now .meta span{display:inline-flex;align-items:center;gap:6px}
.resume{display:grid;gap:2px;border-inline-start:2px solid var(--border-strong);padding-inline-start:12px;font-size:13px;color:var(--text-2)}
.resume b{color:var(--text-1);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.now .actions .primary{flex:0 1 auto}
@container app (max-width:899px){ .now .actions .primary{flex:1 1 100%} }
.next{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text-2);border-top:1px solid var(--border);padding-top:12px}
.next b{color:var(--text-1);font-weight:600}
.band{position:relative;display:flex;height:30px;border-radius:var(--r-sm);overflow:hidden;background:var(--surface-3);direction:rtl}
.band .bseg{position:relative;border-inline-start:1px solid var(--surface-1);display:grid;place-items:center;font-size:11px;color:var(--text-3);overflow:hidden;white-space:nowrap}
.band .bseg:first-child{border-inline-start:0}
.band .bseg .fill{position:absolute;inset:auto 0 0 0;background:color-mix(in srgb,var(--primary) 22%,transparent)}
.band .bseg span{position:relative}
.band .bseg.cur{color:var(--text-1);font-weight:600}
.band .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent);border-radius:2px}
.band-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3)}
.banner{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px;background:var(--surface-2);font-size:13px}
.banner.warn{background:var(--warning-bg);border-color:color-mix(in srgb,var(--warning) 35%,transparent)}
.banner.warn .ic{color:var(--warning)}
.banner .grow{flex:1;display:grid;gap:4px}
.banner b{font-weight:600}

/* مدار اليوم */
.day{display:grid;gap:0}
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.day-h h2{font-size:calc(17px * var(--head-scale))}
.day-h .sum{color:var(--text-3);font-size:13px}
.prayer{display:flex;align-items:center;gap:10px;color:var(--text-3);font-size:12px;padding:10px 0 6px}
.prayer::after{content:"";flex:1;border-top:1px dashed var(--border-strong);opacity:.6}
.prayer b{color:var(--text-2);font-weight:600}
.prayer .waqfa{margin-inline-start:4px}
.period{border-radius:var(--r-lg);padding:6px 10px 8px;margin-inline:-10px}
.period[data-cur="true"]{background:var(--period-current);padding-block:12px;outline:1px solid color-mix(in srgb,var(--primary) 18%,transparent)}
.ph{display:flex;align-items:center;gap:12px;min-height:40px;width:100%;border:0;background:transparent;text-align:start;padding:0;color:inherit}
.ph .nm{font-weight:600;font-size:15px;font-family:var(--font-head)}
.ph .tm{color:var(--text-3);font-size:12px}
.ph .chev{transition:transform var(--dur-2) var(--ease-std)}
.ph[aria-expanded="false"] .chev{transform:rotate(90deg)}
.ph .past-sum{color:var(--text-3);font-size:12px}
.cap{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);white-space:nowrap}
.meter{width:72px;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;position:relative}
.meter i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--cap-fill);border-radius:3px}
.meter[data-over="true"] i{background:var(--cap-over)}
.cap[data-over="true"]{color:var(--warning);font-weight:600}
.items{list-style:none;margin:2px 0 0;padding:0;display:grid}
.row{display:flex;align-items:center;gap:10px;min-height:var(--row-h,44px);padding:4px 0;border-bottom:1px solid color-mix(in srgb,var(--border) 70%,transparent);position:relative}
.items .row:last-child{border-bottom:0}
.chk{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--border-strong);background:transparent;display:grid;place-items:center;padding:0;position:relative}
.chk::after{content:"";position:absolute;inset:-11px}
.chk svg{width:14px;height:14px;opacity:0}
.chk[aria-checked="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chk[aria-checked="true"] svg{opacity:1}
.row.done .rt{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--border-strong)}
.row.just .chk{animation:pop calc(var(--dur-4) * var(--motion-scale)) var(--ease-out)}
@keyframes pop{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent);transform:scale(.85)}60%{transform:scale(1.08)}100%{box-shadow:0 0 0 12px transparent;transform:none}}
.rb{flex:1;min-width:0;display:grid}
.rt{font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.rs{font-size:12px;color:var(--text-3);display:flex;flex-wrap:wrap;gap:2px 10px}
.rs span{display:inline-flex;align-items:center;gap:4px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.badge.commit{background:var(--warning-bg);color:var(--warning)}
.badge.ask{background:var(--info-bg);color:var(--info)}
.badge.habit{background:var(--success-bg);color:var(--success)}
.badge.now{background:var(--primary);color:var(--on-primary)}
.row.meet .rt{font-weight:600}
.timebox{font-size:12px;color:var(--text-2);min-width:62px;text-align:center;border:1px solid var(--border);border-radius:var(--r-sm);padding:2px 4px;background:var(--surface-1)}
.row .more{opacity:0;transition:opacity var(--dur-1)}
.row:hover .more,.row:focus-within .more{opacity:1}
@container app (max-width:899px){ .row .more{opacity:1} .row{min-height:48px} }
.add{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--text-3);min-height:40px;font-size:13px;padding:0}
.add:hover{color:var(--primary-text)}

/* العمود الجانبي */
.rail{display:grid;gap:26px;align-content:start}
.sec h3{font-size:calc(15px * var(--head-scale));display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sec h3 .n{font-family:var(--font-body);font-size:12px;color:var(--text-3);font-weight:500}
.sec h3 .ic{color:var(--text-3)}
.sec .lst{list-style:none;margin:0;padding:0;display:grid}
.sec .it{padding:10px 0;border-bottom:1px solid var(--border);display:grid;gap:6px}
.sec .it:last-child{border-bottom:0}
.sec .it .t{font-size:14px;line-height:1.5}
.sec .it .s{font-size:12px;color:var(--text-3)}
.sec .acts{display:flex;flex-wrap:wrap;gap:4px}
.chipbtn{border:1px solid var(--border);background:var(--surface-1);border-radius:999px;min-height:32px;padding:2px 12px;font-size:12px;color:var(--text-2)}
.chipbtn:hover{border-color:var(--border-strong);color:var(--text-1)}
.chipbtn.strong{border-color:var(--primary);color:var(--primary-text);font-weight:600}
.track{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:0}
.track li{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;font-size:12px;color:var(--text-2);min-height:26px;position:relative}
.track li::before{content:"";width:10px;height:10px;border-radius:50%;border:1.5px solid var(--border-strong);justify-self:center;background:var(--surface-1);z-index:1}
.track li:not(:last-child)::after{content:"";position:absolute;inset-inline-start:8.5px;top:17px;height:18px;border-inline-start:1px solid var(--border-strong)}
.track li[data-s="done"]::before{background:var(--success);border-color:var(--success)}
.track li[data-s="today"]::before{background:var(--accent);border-color:var(--accent)}
.track li[data-s="today"]{color:var(--text-1);font-weight:600}
.track li .d{color:var(--text-3)}
.due{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--warning);font-weight:600}
.priv{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text-3)}

/* حالات */
.sk{background:linear-gradient(90deg,var(--surface-3),var(--surface-2),var(--surface-3));background-size:200% 100%;animation:sh 1.4s infinite linear;border-radius:var(--r-md)}
@keyframes sh{to{background-position:-200% 0}}
.empty{display:grid;justify-items:start;gap:12px;padding:8px 0}
.empty .art{width:100%;max-width:420px;aspect-ratio:3 / 1;max-height:120px}
.empty p{margin:0;color:var(--text-2);max-width:52ch}
.close-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.close-list li{display:flex;gap:8px;align-items:center;font-size:14px}
.close-list .ic{color:var(--success)}
.reason{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.reason button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.field{display:grid;gap:4px}
.field label{font-size:12px;color:var(--text-2);font-weight:600}
.inp{width:100%;min-height:40px;border:1px solid var(--border-strong);border-radius:var(--r-md);background:var(--surface-1);padding:8px 12px;color:var(--text-1)}
.app[data-palette="classic"] .inp{border-width:0 0 1px;border-radius:0;background:transparent}
.inp::placeholder{color:var(--text-3)}
.stat{display:flex;gap:24px;flex-wrap:wrap}
.stat div{display:grid}
.stat b{font-size:24px;font-family:var(--font-head);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--text-3)}

/* ---------- المهام ---------- */
.tasks{padding:16px 16px 28px;display:grid;gap:16px}
@container app (min-width:900px){ .tasks{padding:24px 32px 40px;max-width:1300px} }
.th{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.th h2{font-size:calc(22px * var(--head-scale));margin-inline-end:auto}
.views{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-lg);padding:3px;background:var(--surface-2);gap:2px}
.views button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:calc(var(--r-lg) - 3px);min-height:36px;padding:4px 12px;color:var(--text-2)}
.views button[aria-selected="true"]{background:var(--surface-1);color:var(--text-1);font-weight:600;box-shadow:var(--elev-1)}
@container app (max-width:899px){ .views{width:100%} .views button{flex:1;justify-content:center} }
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--border);border-radius:999px;min-height:36px;padding:2px 14px;background:var(--surface-1);color:var(--text-2);font-size:13px}
.filters button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:600}
.grp{display:grid;gap:2px}
.grp h3{font-size:13px;font-family:var(--font-body);font-weight:600;color:var(--text-2);display:flex;gap:8px;align-items:center;padding:12px 0 4px;border-bottom:1px solid var(--border)}
.grp h3 .n{color:var(--text-3);font-weight:400}
.subp{font-size:12px;color:var(--text-3);padding:8px 0 0}
.commit-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.cs{flex:none;min-width:240px;border:1px solid var(--border);border-radius:var(--r-lg);padding:10px 12px;background:var(--surface-1);display:grid;gap:4px;font-size:13px}
.cs .s{color:var(--text-3);font-size:12px}
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;align-items:start;overflow-x:auto;padding-bottom:6px}
.bcol{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:10px;display:grid;gap:8px;min-height:200px;align-content:start}
.bcol[data-drop="true"]{outline:2px dashed var(--primary);outline-offset:-4px}
.bh{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:13px;padding:2px 4px}
.bh .lim{font-weight:500;font-size:12px;color:var(--text-3)}
.bh .lim[data-over="true"]{color:var(--warning);font-weight:600}
.wip-note{font-size:12px;color:var(--warning);background:var(--warning-bg);border-radius:var(--r-md);padding:6px 8px}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-md);padding:10px;display:grid;gap:6px;box-shadow:var(--elev-1)}
.card[draggable="true"]{cursor:grab}
.card.dragging{opacity:.5}
.card .t{font-size:13.5px;line-height:1.45}
.card .f{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3);flex-wrap:wrap}
.card .f .mv{margin-inline-start:auto}
.age{display:inline-flex;align-items:center;gap:4px}
.age[data-old="true"]{color:var(--warning);font-weight:600}
.colpick{display:flex;gap:6px;overflow-x:auto}
.cal{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface-1)}
.cal table{border-collapse:collapse;width:100%;min-width:900px;table-layout:fixed}
.cal th,.cal td{border-bottom:1px solid var(--border);border-inline-start:1px solid var(--border);vertical-align:top;padding:6px;font-size:12px;text-align:start}
.cal thead th{background:var(--surface-2);font-weight:600;position:sticky;top:0}
.cal thead th.today{background:var(--period-current);box-shadow:inset 0 -2px 0 var(--accent)}
.cal tbody th{width:96px;color:var(--text-2);font-weight:600;background:var(--surface-2)}
.cal td.today{background:color-mix(in srgb,var(--primary) 4%,var(--surface-1))}
.ce{display:block;border-radius:var(--r-sm);padding:3px 6px;margin-bottom:4px;background:var(--surface-3);line-height:1.4}
.ce.meet{background:var(--info-bg);color:var(--info)}
.ce.done{color:var(--text-3);text-decoration:line-through}
.ce.commit{background:var(--warning-bg);color:var(--warning);font-weight:600}
.agenda{display:grid;gap:14px}
.agenda .dayh{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:baseline}
.agenda .dayh span{color:var(--text-3);font-weight:400;font-size:12px}

/* ---------- الطبقات: نوافذ وقوائم ---------- */
.layer{position:absolute;inset:0;pointer-events:none;z-index:30}
.layer>*{pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--overlay);animation:fade calc(var(--dur-2) * var(--motion-scale)) var(--ease-std)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(16px);opacity:0}}

# «يوم» نَسَق: دراسة وقرار لصفحتي «اليوم» و«المهام»

تاريخ الإعداد والاطلاع على المصادر: 21 أكتوبر 2026 | 10 جمادى الأولى 1448 هـ. مفتاح القوة: **[أ]** مصدر أولي محكّم أو تحليل تلوي، **[ب]** جهة موثوقة أو دراسة جيدة، **[ج]** توثيق شركة أو سجل تغييرات، **[د]** رأي أو مدونة أو مراجعة منافس أو شكاوى مستخدمين، **[غ]** لم يُتحقق، **[تقدير]** حكم الفريق.

## 1. الملخص التنفيذي

1. **ما سنبنيه:** «يوم يُقترح ولا يُفرض». صفحة «اليوم» شاشة واحدة يتصدّرها عنصر مهيمن واحد هو «الآن»، وتحته «مدار اليوم»: المهام والمواعيد والعادات مرتّبة في **فترات بين الصلوات** بدل ساعات دقيقة، ولكل فترة سعة ظاهرة.
2. كل صباح تُجهَّز **«مسودة اليوم»** محليًا، بلا ذكاء اصطناعي، من بقايا الأمس والتزامات المشاريع والتقويم والعادات، ضمن السعة. يعتمدها المستخدم أو يعدّلها في أقل من دقيقتين.
3. صفحة «المهام» بيانات واحدة بثلاثة عروض: قائمة، ولوحة بحدّ عمل ناعم وعمر البند وبديل «انقل إلى…» للسحب، وجدول أسبوعي بالفترات.
4. **لماذا نتفوّق؟** لكل جزء سابقة عند منافس، لكن لم نجد منتجًا يجمعها: فترات الصلاة كوحدة سعة، والتزامات المنح تتحول إلى كتل عمل عكسية بموافقة، وتحليل عربي محلي للالتقاط، وترحيل بلا ذنب يتعلم من تقديراتك، وطلبات وموافقات فريق بخصوصية يفرضها الخادم. والكل عربي الأصل، يعمل دون اتصال، ودون اشتراك لكل مستخدم.
5. **ما رفضناه من التصوّر الأولي بدليل:** رقم «ثلاث أولويات»، وبومودورو كمحرّك، والجدولة الدقيقة بالساعة كأصل، وكانبان بحدّ صارم للفرد، والسلاسل (streaks).
6. **ما أضفناه ولم يكن في التصوّر:** «ملاحظة الاستئناف» عند كل توقف، وهي أقوى دليل وأرخص كلفة في هذه الدراسة. و«معامل تقديرك الشخصي». وتحويل «الختام» إلى فترة طبيعية بعد العشاء بدل شاشة منفصلة.
7. **أهم 5 مخاطر:**
   - (1) فترات الصلاة تفترض موقعًا واحدًا وممارسة واحدة، فيلزم موقع لكل مستخدم ووضع «بالساعة» بديلًا.
   - (2) المسودة الآلية قد تُعتمد دون تفكير، لأن الافتراضيات قوية، أو تُفقد الثقة إن أخطأت.
   - (3) حدود Apps Script ونوشن (3 طلبات/ث) عند الجدولة العكسية وتعدد المستخدمين.
   - (4) الاتصال المتقطع وتعارضات المزامنة: Safari لا يدعم Background Sync.
   - (5) تضخم النطاق على مطوّر واحد. لذلك MVP أسبوعين محصور في 6 بنود.

## 2. السوق والمنافسون

### 2.1 بطاقات المنافسين (ما فُحص فعلًا في هذه الجولة)

| المنتج | المستخدم المستهدف | بنية «اليوم/مهامي» | ما يتقنه | ما يفشل فيه (بدليل) | ما لا يفعله عمدًا |
|---|---|---|---|---|---|
| Sunsama | فرد معرفي بأدوات متعددة | طقس صباحي: مراجعة الأمس، اختيار مهام اليوم وتقديرها، ثم طقس إغلاق يرحّل الباقي | تحذير الحمل: يقارن مجموع التقديرات بساعاتك المتاحة [د] (asianefficiency 2026) | السعر بلا خطة مجانية: الأرقام متضاربة بين نحو 16 و25 $/شهر [د]؛ شكوى أن الطقس صار «عشرين دقيقة» [د]؛ التخطيط الكامل غير متاح على الجوال [د] | لا يجدول تلقائيًا؛ ليس أداة مشاريع [د] |
| Motion | فرد وفرق تريد جدولة آلية | يضع المهام في التقويم آليًا ويعيد ترتيبها | الجدولة الآلية نفسها هي الأكثر مديحًا [د] | خطة «تعيد ترتيب نفسها باستمرار»، وتطبيق جوال ضعيف، وسعر مرتفع، وشكاوى استرداد [د] | لا يطلب إذنك قبل كل إعادة جدولة [د] |
| Akiflow | محترف يجمع مهام من أدوات كثيرة | صندوق وارد موحّد من أكثر من 30 أداة، ثم سحب إلى التقويم | لوحة أوامر واختصارات، وفرز سريع [د] | لا خطة مجانية، و19 $ سنويًا أو 34 $ شهريًا؛ شكاوى خصم بعد الإلغاء [د] | — |
| Reclaim | فرق تقويم Google/Outlook | كتل عادات ومهام واستراحات تُحجز آليًا | العادات كحجوزات مرنة | استحوذت عليه Dropbox في أغسطس 2024 [ب] (TechCrunch)؛ مستقبل المنتج مرتبط بالمالك | — |
| Morgen | فرد بتقاويم متعددة | «مخطّط ذكي» يقترح خطة داخل «أطر» (Frames) تمثّل أسبوعك المثالي | **يعرض الخطة للمعاينة قبل الحفظ**، ولا يزامنها مع التقويم إلا بعد الموافقة [ج] | — (لم نجد شكاوى موثقة في هذه الجولة) | — |
| Structured | فرد على أجهزة Apple | خط زمني رأسي واحد لليوم | بساطة الخط الزمني، و«مراقب الطاقة» (تجريبي في الإعدادات المتقدمة) [ج] | — | لا فرق |
| Things 3 | فرد على Apple | «اليوم» مع قسم «هذا المساء» | فصل النهار عن المساء ببساطة؛ التحديث التلقائي عند منتصف الليل [ب] | — | لا تعاون ولا ويب [تقدير، معرفة عامة] |
| Todoist | فرد وفرق صغيرة | قسم «متأخرة» منفصل، و«اليوم» | Ramble: التقاط صوتي بأكثر من 38–40 لغة، تجريبي [ج]، يعمل على Gemini 2.5 Flash Live عبر Vertex [ب] | **نحو 70% من المستخدمين النشطين لديهم مهمة متأخرة واحدة على الأقل، والرئيس التنفيذي يصف القائمة الطويلة بأنها «تسبب قلقًا كبيرًا»** [ج] (Fast Company 2016، بيانات الشركة) | الصوت يُعالَج في السحابة [ب] |
| Microsoft To Do | فرد في Microsoft 365 | «يومي» يُفرَّغ كل ليلة، ومنه «اقتراحات» | الالتزام الواعي: لا شيء يدخل «يومي» إلا باختيارك [ج] | ما لم يُنجز يعود إلى القائمة بصمت [ج] | لا يعرض السعة |

| **رنا** (مديرة مشروعين) | فريق + مشاريع | متابعة المؤشرات، وتجميع أرقام الميدان، وكتابة التقرير الربعي، وتنسيق الموردين | تعرض مستحقات مشروعيها فقط، وتقترح كتل عمل قبل كل تقرير، وتُظهر من تنتظر منه أرقامًا | لوحة المشروع وطلبات «أطلب من/يطلب مني» |
| **سامر** (المالي) | فريق + مشاريع + إحصائيات مالية | مطابقة إيصالات، وطلبات صرف، وتقارير مالية مرحلية | الموافقات بمهلة، والإيصالات الملتقطة، ومواعيد التقارير المالية | قائمة «بانتظار» ومن تأخر ردّه، دون إظهار مهام خاصة لغيره |
| **أحمد** (منسّق ميداني) | فريق: اليوم فقط | زيارات مراكز إيواء، وتوزيع، وجمع بيانات، واتصال متقطع، وجوال بيد واحدة | التقاط سريع دون اتصال، و«الآن» كبيرة، والفترات بين الصلوات تطابق إيقاع يومه الميداني | قائمة بسيطة، وطلبات واردة من مديرته كمهام |
| **هبة** (مساعدة إدارية) | فريق + مشاريع | مراسلات، وجدولة، ومتابعة توقيعات، وأرشفة | الوارد والفرز السريع، والمهام الصغيرة الكثيرة في فترة واحدة | لوحة بعمر البند لترى ما علق |

## 5. التصوّر والبنية

### 5.1 خريطة المعلومات

- **اليوم**
  - الترويسة: التاريخان، والمزامنة، والالتقاط.
  - «الآن»: العنصر المهيمن. يتبدّل بحسب الوقت إلى «مسودة الصباح» أو «الختام».
  - «مدار اليوم»: الفترات، وفي كل فترة مهام ومواعيد وعادات وسعة.
  - العمود الجانبي (الجوال: تبويب «الوارد»): الوارد، وتنتظر قرارًا، والتزامات قادمة (المالك والمشاريع)، والطلبات.
- **المهام**
  - الرأس: العروض (قائمة/لوحة/جدول)، والمرشحات، والبحث.
  - المحتوى بحسب العرض، وشريط مستحقات المشاريع (للمالك والمشاريع).
- **الالتقاط** (نافذة عامة): نص، أو لصق رسالة، أو صوت (موجة لاحقة).
- **وحدات أخرى** تظهر بحسب الصلاحية فقط: المشاريع، والعادات، والمصروفات، والإحصائيات.

### 5.2 التدفقات الرئيسية

| التدفق | الخطوات | معيار النجاح |
|---|---|---|
| **الصباح** | يفتح التطبيق بعد الفجر أو الشروق ← «مسودة اليوم جاهزة: 6 مهام، 4 س 30 د من 6 س» ← يراجع البنود المقترحة (✓ أو إزالة) ← «اعتمد» ← تظهر «الآن» | وسيط زمن الاعتماد أقل من 90 ثانية |
| **أثناء اليوم** | «الآن» ← «ابدأ جلسة حتى العصر» ← «تمّت» أو «توقّف + ملاحظة استئناف» ← التالي يظهر | نسبة الجلسات التي تُستأنف بملاحظة |
| **تغيّر طارئ** | اجتماع جديد يزاحم ← بطاقة اقتراح: «انقل المسودة إلى بعد العصر؟» ← اعتماد أو بديل أو إبقاء | صفر إعادة جدولة صامتة |
| **الحمل الزائد** | مجموع الفترة أكبر من سعتها ← مقياس يتجاوز ← «اقترح توزيعًا» ← قائمة نقل مقترحة | خطط مكتملة بنسبة أعلى |
| **الالتقاط** | `N` أو زر «+» ← «اتصال بالمورّد بعد العصر 20 د #هيوميرا» ← رقائق تحليل حيّة ← Enter ← «أُضيفت إلى بعد العصر» + تراجع | أقل من 5 ثوانٍ |
| **التسليم** | «اطلب من أحمد: أرقام المستفيدين حتى الخميس» ← يصل إلى وارد أحمد ← يقبل أو يفاوض الموعد ← يظهر عند رنا في «أنتظر» | زمن الرد على الطلبات |
| **الختام** | بعد العشاء: ما أُنجز (آليًا) ← المرحّل بسبب برقاقة ← جملة تعلّم (اختيارية) ← معاينة مسودة الغد ← «أغلق اليوم» | نسبة الأيام المغلقة |
| **الطوارئ** | «يوم طارئ» ← تُطوى كل الفترات، و«الآن» = البند الطارئ، والباقي يُرحَّل كتلة واحدة بقرار واحد | استعادة اليوم بنقرة |

**قاعدة:** لا نغيّر مفاتيح `daily-board-*` ولا أسماء حقول نوشن. الحقول الجديدة تُضاف في ملف حالة المستخدم على Drive، أو في خصائص نوشن جديدة للمالك.

## 6. عشرة تمايزات (مرتّبة بالأثر)

### نقد خط الأساس قبل التجاوز

| في التصوّر الأولي | المشكلة | البديل |
|---|---|---|
| ثلاث لحظات (خطّط/نفّذ/أغلق) كشاشات | ثلاثة طقوس يومية تتحول إلى عبء. شكوى Sunsama: «عشرون دقيقة» [د] | **صفحة واحدة تتبدّل بالوقت.** المسودة جاهزة والمستخدم يعتمد فقط |
| «أهم ثلاث» | رقم بلا دليل | «الأهم» واحد يتصدّر «الآن»، والسعة تحدد العدد |
| «إذا… فإنّ…» لكل أولوية | أثر صغير في التسليم الذاتي [أ]، وكلفة كتابة يومية | لمهمة واحدة صعبة، بقالب بنقرة |
| بطاقة «الآن» + عمود زمني + التقاط | ثلاث كتل متساوية الوزن. هذه نفس مشكلة التصميم الحالي | «الآن» مهيمنة، والفترات تجمع المهام والمواعيد والعادات في سطح واحد |
| كانبان بحد 3 للفرد | دليل الحد للفرد ضعيف [ب–ج] | اللوحة للمشاريع والفريق. للفرد «الآن» هي الحد الطبيعي |
| مقياس سعة واحد لليوم | اليوم ليس كتلة واحدة: اجتماع الضحى لا يحرّر وقت العصر | **سعة لكل فترة** |
| غياب الاستئناف | أقوى دليل وجدناه (Leroy & Glomb 2018 [أ]) لم يُستعمل | ملاحظة الاستئناف |

### التمايز 1: «مسودة اليوم»: يوم جاهز يُعتمد في دقيقة

1. **الفكرة:** عند أول فتح بعد الفجر، يجمّع نَسَق محليًا مسودة من بقايا الأمس، وكتل الالتزامات العكسية، ومواعيد التقويم، والعادات المرتبطة بالفترات، والمهام ذات النية لليوم. يملأ كل فترة حتى **80% من سعتها فقط**، ويعرضها بندًا بندًا. اعتماد بنقرة، أو إزالة بنقرة.
   - **التفوّق:** Sunsama يطلب منك بناء اليوم يدويًا كل صباح [د]. وMotion يبنيه ويطبّقه دون إذن ويعيد ترتيبه [د]. وMorgen يقترح ويطلب الموافقة [ج]، لكنه يحتاج «أطرًا» تُبنى يدويًا ولا يعرف التزامات المنح ولا الصلاة.
2. **الدليل والسابقة:** سابقة Morgen في المعاينة قبل الحفظ [ج]. أثر الافتراضيات [أ]، وهو سيف ذو حدين، ولذلك 80%. ودعم الاستقلالية [أ].
3. **الكلفة:** متوسطة. خوارزمية محلية في `nasaq-core.js`، بلا خدمة خارجية. **الخطر:** مسودة خاطئة تهدم الثقة، فنبدأ محافظين. **الخصوصية:** محلية بالكامل.
4. **الاختبار:**
   - **الفرضية:** المسودة تقلّل زمن التخطيط دون خفض نسبة الإنجاز.
   - **النجاح:** وسيط زمن الاعتماد ≤ 90 ث، ونسبة الأيام المخطَّطة ≥ 60% (مقابل الخط الحالي)، ونسبة إنجاز المخطّط لا تنخفض.
   - **القياس:** طوابع محلية مجهولة الهوية.
5. **التعبير البصري:** «الآن» تتحول صباحًا إلى بطاقة «مسودة اليوم» بملخص رقمي وقائمة بنود بمفاتيح تبديل، وزر رئيسي واحد «اعتمد المسودة».

### التمايز 2: فترات الصلاة وحدة جدولة بسعة، مع وضع رمضان

1. **الفكرة:** وحدة التخطيط هي الفترة: قبل الفجر، والفجر، والضحى، والظهر، والعصر، والمغرب، والعشاء. نكتب «بعد العصر»، لا «15:40». لكل فترة دقائق متاحة، تساوي طولها ناقص المواعيد ناقص هامش 15%. ويعيد رمضان رسم اليوم: السحور، والإمساك، والإفطار، والتراويح، وتُحسب السعة من نافذة المستخدم.
   - **التفوّق:** Things يفصل «هذا المساء» فقط. وMorgen يطلب أن تبني أطرك يدويًا. وMyWaqt وBarakah Tasks يربطان بالصلاة للفرد دون سعة ودون التزامات مؤسسية [ج]. نحن نجمع الإيقاع الطبيعي والسعة والتزامات العمل.
2. **الدليل:** لا دليل على أن الجدولة الدقيقة بالساعة طريقة متفوقة (ملاحظة سابقة). وشكاوى إعادة الترتيب [د]. ووحدة أخشن تقلّل كلفة «انكسار الخطة» [تقدير]. **ابتكار جزئي.**
3. **الكلفة:** سهلة، فحساب المواقيت موجود في `NasaqTime`. نضيف موقعًا لكل مستخدم (إحداثيات أو مدينة) بدل الثابت.
   - **الخطر:** موظفون بممارسة مختلفة أو في مدن أخرى. **الحل:** وضع «بالساعة» يُبقي الفترات كتقسيم زمني محايد، ويسمّيها «الصباح، الظهيرة، العصر، المساء».
4. **الاختبار:**
   - **الفرضية:** المهام المحددة بفترة تُنجز في يومها بنسبة أعلى من المهام بلا فترة، ولا تقل عن المهام بساعة دقيقة.
   - **القياس:** نسبة الإنجاز حسب نوع التحديد، وعدد إعادات الجدولة.
5. **التعبير البصري:** «مدار اليوم». الفترات صفوف رأسية تفصلها خطوط رفيعة بأسماء الصلوات وأوقاتها نصًّا، والحالية مفتوحة ومظلَّلة، والماضية مطوية بملخص. وشريط أفقي رفيع في «الآن» يسري زمنه من اليمين إلى اليسار.

### التمايز 3: ملاحظة الاستئناف: لا تفقد خيطك

1. **الفكرة:** «توقّف» لا يعني إيقاف المؤقت فقط. يطلب سطرًا واحدًا اختياريًا: «أين وصلت؟ ما الخطوة التالية؟». يُقترح الشيء نفسه تلقائيًا عند بدء اجتماع من التقويم أثناء جلسة، ويظهر السطر في «الآن» عند العودة.
   - **التفوّق:** لم نجد في المنتجات التي فحصناها ميزة كهذه [غ: غياب دليل].
2. **الدليل:** Leroy & Glomb 2018 [أ]: الخطة تقلّل بقايا الانتباه وتحسّن أداء المهمة المقاطِعة. التحفّظ: لم يختبروا أداء المهمة الأصلية.
3. **الكلفة:** سهلة جدًا. حقل `resume_note`. **الخطر:** إزعاج إن صار إجباريًا، فهو اختياري بزر «تخطَّ».
4. **الاختبار:** **الفرضية:** الجلسات المستأنفة بملاحظة تُنجز أسرع. **القياس:** زمن الاستئناف حتى أول تعديل، ونسبة الإنجاز في اليوم نفسه.
5. **التعبير البصري:** سطر بخط أصغر داخل «الآن»: «توقفتَ عند: جدول المؤشرات، القسم 3 | التالي: أرقام المستفيدين».

### التمايز 4: الجدولة العكسية من التزامات المنح

1. **الفكرة:** كل استحقاق مشروع في نوشن يحمل قالب خطوات. مثلًا تقرير ربعي: جمع المؤشرات، فالمسودة، فالمطابقة المالية، فالاعتماد، فالإرسال، مع تقدير لكل خطوة من سجلك. ونَسَق يقترح كتلًا في فترات قبل الموعد بهامش يومين، ولا يُنشئ شيئًا في نوشن إلا بعد «اعتمد الخطة».
   - **التفوّق:** Asana يرقّي المهام حسب الاستحقاق فقط [ج]. وFluxx ينبّه بالمواعيد للمانح [ج]. ولا أحد يحوّل «التقرير يُستحق الأحد» إلى «ساعتان بعد الظهر اليوم» في لوح العامل.
2. **الدليل:** التخطيط العكسي [ب] (مختلط). وأثر التأخير في الدفعات [ج]. ونموذج 8+3 يعطي هيكلًا موحّدًا للتقرير السردي [ب].
3. **الكلفة:** متوسطة. الجسر يقرأ المستحقات (قائمة مخبأة)، والحساب على الجهاز، والكتابة إلى نوشن دفعة واحدة عند الاعتماد. الطلب الواحد يبقى أقل من حد 3 طلبات/ث [ج] بطابور. **الخطر:** قوالب خاطئة، فتكون قابلة للتعديل لكل مانح.
4. **الاختبار:** **الفرضية:** نسبة التقارير المرسلة قبل الموعد بيومين ترتفع. **القياس:** الفرق بين تاريخ الإرسال والاستحقاق، قبل وبعد.
5. **التعبير البصري:** في «التزامات قادمة»، خط زمني صغير للخطوات (✓ أمس، ● اليوم، ○ الخميس…) وزر «اعتمد الخطة» أو «عدّل».

### التمايز 5: «تنتظر قرارًا» بدل «متأخرة»، ودفتر وعود بلا ذنب

1. **الفكرة:** لا كلمة «متأخر» ولا أحمر للمهام الشخصية. ما فات يومه يدخل «تنتظر قرارًا» بأربعة خيارات: أعِدها لفترة اليوم، أو موعد آخر، أو «يومًا ما» بتاريخ مراجعة، أو أسقطها بسبب. وما رُحّل 3 مرات يُسأل عنه: «فكّكها؟ أسقطها؟». والدفتر يعرض نسبة الوفاء بالوعود أسبوعيًا، دون عدّاد سلاسل.
   - **التفوّق:** Todoist يُبقي قسم «متأخرة»، وتقر الشركة بأنه يسبب قلقًا [ج]. وLinear وMS To Do يرحّلان بصمت [ج].
2. **الدليل:** Wohl 2010 [ب، ارتباطي]، وSilverman & Barasch 2023 [أ]، وAmabile [ب].
3. **الكلفة:** سهلة. **الخطر:** تمييع المواعيد الحقيقية، فالمواعيد الصلبة (`due`) لمستحقات المشاريع تبقى ظاهرة بلون التحذير مع أيقونة ونص، لأنها التزام تجاه طرف آخر.
4. **الاختبار:** **الفرضية:** يقلّ «الهجر»، أي الأيام بلا فتح بعد يوم سيئ. **القياس:** العودة في اليوم التالي لأيام منخفضة الإنجاز.
5. **التعبير البصري:** بطاقة جانبية هادئة: «تنتظر قرارًا (2)»، وأزرار نصية صغيرة، ورقاقة «رُحّلت 3 مرات» محايدة.

### التمايز 6: معامل تقديرك الشخصي (مغالطة التخطيط تُعالج بالبيانات)

1. **الفكرة:** نسجّل التقدير والفعلي لكل مهمة فيها جلسة أو بدء وإنجاز، ونحسب المعامل لكل نوع: «تقاريرك تأخذ عادة ×1.4 مما تقدّر». السعة والمسودة تستعملان التقدير مصحَّحًا، مع إظهار الاثنين.
   - **التفوّق:** Sunsama يقارن التقدير بالساعات المتاحة [د]، ولم نتحقق إن كان يتعلم من الفعلي [غ].
2. **الدليل:** Buehler 1994 [أ]. Roy 2005 [أ]: الذاكرة نفسها متحيزة، فالتسجيل أفضل من السؤال.
3. **الكلفة:** سهلة–متوسطة. **الخطر:** بيانات قليلة، فلا يظهر المعامل قبل 8 عينات لكل نوع.
4. **الاختبار:** **الفرضية:** متوسط خطأ التقدير المطلق ينخفض خلال 4 أسابيع.
5. **التعبير البصري:** في «الآن»: «تقديرك 90 د | المعتاد لمثلها 2 س 05 د». رقمان، بلا حكم.

### التمايز 7: التقاط عربي بلا احتكاك (محلي أولًا)

1. **الفكرة:** محلّل عربي على الجهاز يفهم:
   - الأيام: «بكرا، بعد بكرا، الخميس الجاي».
   - الفترات: «بعد العصر، العصرية، الصبح».
   - الساعات: «3 العصر».
   - المدد: «نص ساعة، ساعتين، 20 د».
   - المشروع والشخص: «#مشروع»، «@شخص».
   - وأنماط الطلب: «ذكّرني أن».

   ويحوّل الأرقام العربية آليًا. ولصق رسالة واتساب يقترح بنودًا. والصوت موجة لاحقة، بإفصاح.
   - **التفوّق:** Todoist Ramble قوي لكنه سحابي [ج/ب]، ولم نجد ما يفهم الفترات الإسلامية بالعامية إلا أدوات فردية لم نختبرها.
2. **الدليل:** ضعف التعرّف على اللهجة الفلسطينية [ب]، فالنص المحلي أولًا. **ابتكار جزئي.**
3. **الكلفة:** النص سهل. واللصق سهل. والصوت متوسط: Web Speech متاح في Chrome وSafari، وفي Chrome يُرسل الصوت لخادم [ب]. Share Target على أندرويد سهل، وغير ممكن على iOS [غ: يُتحقق].
4. **الاختبار:** **الفرضية:** زمن الالتقاط أقل من 5 ث. **القياس:** دقة المحلّل على 200 جملة حقيقية من الفريق بنسبة ≥ 90% للتاريخ والفترة، ونسبة التصحيح اليدوي.
5. **التعبير البصري:** رقائق تحليل حيّة تحت الحقل، بلون مختلف لكل نوع ونص يسمّيه، وسطر معاينة: «ستُضاف إلى: اليوم | بعد العصر | 20 د».

### التمايز 8: يوم يتكيّف بالعرض لا بالفرض

1. **الفكرة:** حين يتغير اليوم (اجتماع جديد، أو مهمة عاجلة، أو تجاوز سعة)، يعرض نَسَق «فرقًا» واضحًا: ما الذي يتأثر، والاقتراح، وبديلين. لا شيء يتحرك دون نقرة.
   - **التفوّق:** على Motion (إعادة ترتيب دائمة [د]) وعلى Linear (ترحيل صامت [ج]).
2. **الدليل:** دعم الاستقلالية [أ]، وشكاوى المنافس [د].
3. **الكلفة:** متوسطة. للمالك: الجسر يقارن التقويم عند كل مزامنة. وللفريق: التغيّر يأتي من مهامهم. **الخطر:** كثرة الاقتراحات، فنكتفي باقتراح واحد مرئي في كل مرة.
4. **الاختبار:** **القياس:** نسبة قبول الاقتراحات، فإن كانت أقل من 40% فالخوارزمية خاطئة. وصفر نقل صامت.
5. **التعبير البصري:** بطاقة اقتراح تنزلق فوق «مدار اليوم»: «اجتماع جديد 13:30–14:15 يزاحم 45 د من المسودة. اقتراح: انقلها إلى بعد العصر».

### التمايز 9: «أطلب منك / تطلب مني» وموافقات بمهلة، بخصوصية يفرضها الخادم

1. **الفكرة:** نوع بند من الدرجة الأولى: طلب بمهلة، يصل إلى «الوارد» عند المستلم، لا إلى يومه مباشرة. المستلم يقبل، أو يفاوض الموعد، أو يعتذر. والموافقة (صرف، أو مستند) زر واحد مع تعليق. وكل بند يحمل شارة خصوصية (خاص، أو مشترك مع فلان، أو المشروع).
   - **التفوّق:** Asana فيه «أُسند حديثًا» [ج] لكن بلا مفاوضة موعد ولا RTL. وClickUp يستثني الخاص من ملخصاته [ج]، ونحن نجعل الخصوصية مرئية على كل بند.
2. **الدليل:** تماسك الفريق يحمي من الاحتراق [ب]. وعبء الموافقات في المنظمات [ج]. **ابتكار في التركيب.**
3. **الكلفة:** متوسطة–صعبة. ملف «صندوق طلبات» لكل مستخدم على Drive يكتبه الجسر وحده بعد التحقق من الصلاحية. **الخطر:** تسريب وجود مهام، فالمستلم لا يرى إلا البند نفسه.
4. **الاختبار:** **القياس:** وسيط زمن الرد على الطلب، ونسبة الطلبات المغلقة قبل مهلتها.
5. **التعبير البصري:** قسم «طلبات» في العمود الجانبي بشارة «ينتظرك» أو «تنتظره»، ومؤقت مهلة نصي.

### التمايز 10: مراجعة أسبوعية تربط الإنجاز بالالتزامات، وبدايات جديدة على معالم الهجري

1. **الفكرة:** في آخر يوم من أسبوع العمل (السبت–الخميس أو الأحد–الخميس، قابل للضبط)، ثلاث شاشات قصيرة:
   - ما تقدّم في كل التزام.
   - ما يتكرر ترحيله.
   - متى تنجز أفضل (أي الفترات).

   وفي أول الشهر الهجري وفي رمضان: «بداية جديدة؟» لعادة أو هدف.
   - **التفوّق:** ClickUp StandUp يلخّص النشاط [ج]، لكنه لا يربطه بالتزامات المانحين، ولا يعرف المعالم الهجرية.
2. **الدليل:** Dai وزملاؤه 2014 [أ]، وAmabile [ب].
3. **الكلفة:** سهلة–متوسطة، محلية. **الخطر:** إحصاءات تُشعر بالمراقبة، فهي شخصية افتراضيًا، ولا يراها المدير إلا إن شاركها صاحبها.
4. **الاختبار:** **القياس:** نسبة إكمال المراجعة، وانخفاض البنود المرحّلة 3 مرات فأكثر.
5. **التعبير البصري:** (موجة 3) بطاقة «ختام الأسبوع» تظهر مكان «الختام» يوم الخميس.

### ما بعد العشرة

| الاتجاه | الحكم |
|---|---|
| ذكاء اصطناعي محترم للخصوصية | **مقبول بتحديد:** ثلاثة أفعال فقط عند الطلب، بإفصاح، بمفتاح المنظمة عبر الجسر مع سقف يومي، وكلها بديل محلي حتمي: «فكّك هذه المهمة» (Kruger & Evans)، و«صُغ طلبًا مهذبًا»، و«لخّص الأسبوع». **لا تخطيط آليًا بنموذج لغوي في MVP** |
| تجربة جوال استثنائية | **مقبول:** شريط سفلي، وزر التقاط في الوسط، و«الآن | اليوم كله | الوارد» بدل التمرير الطويل، ووضع تركيز بملء الشاشة، ودون اتصال بطابور محلي. ودجات iOS **غير ممكنة** (PWA)، والبديل: شارة الأيقونة عبر Badging API للتطبيق المثبّت [ج] وإشعار هادئ |
| لوحة/قائمة/جدول لبيانات واحدة | **مقبول** في «المهام»، مع عمر البند نصًّا وحد ناعم للفرق |
| الالتقاط من واتساب مباشرة | **غير ممكن الآن** دون واجهة أعمال مدفوعة [تقدير]. البديل: لصق، ومشاركة على أندرويد |
| ودجات الشاشة الرئيسية | **غير ممكن** في PWA. البديل: الشارة، و«الآن» أول ما يُرى، واختصار تطبيق |
| «يوم طارئ» | **ابتكار مقترح:** زر واحد يطوي الخطة ويضع الطارئ في «الآن» ويرحّل الباقي كتلة بقرار لاحق. مناسب لعمل إنساني متقلب [تقدير] |

## 7. الأرتيفاكت: كيف تجرّبه

الملف: `design/today-2026/nasaq-today-lab.html`. يعمل بفتحه في المتصفح، بلا خادم ولا بناء، وبيانات وهمية واقعية. ونسخته المنشورة في الرابط المرفق.

| الشريط العلوي | ما يفعله |
|---|---|
| **النموذج / الدراسة** | يبدّل بين النموذج التفاعلي وهذه الدراسة |
| **الجهاز** | حاسوب 1440 (مصغّر ليناسب شاشتك) أو جوال 390. الجوال تصميم مستقل: شريط سفلي، وزر التقاط في الوسط، وتبويبات «الآن، اليوم كله، الوارد» |
| **الحساب** | مالك، أو فريق: اليوم فقط، أو فريق + مشاريع، أو حساب بلا وحدات. ما لا يحق للحساب لا يظهر إطلاقًا |
| **الطابع والوضع** | نَسَق، وكلاسيكي، ونَسَق 360، وكهرمان. فاتح أو داكن. بقيم الألوان من `themes/*.css` |
| **الحالة** | يوم عادي، ومسودة الصباح، وفارغ، وتحميل، وخطأ مزامنة، وحمل زائد، واجتماع جديد، والختام، ويوم مغلق، وأنجزت كل شيء، ورمضان قبل الفجر |
| **لماذا؟** | يضع علامات على قرارات التصميم. اضغط أي علامة لترى الدليل ودرجته |
| **الصوت** | نقرات هادئة عند الإنجاز. مطفأ افتراضيًا |

**جرّب:**

- **الالتقاط:** اضغط `N` أو «التقط»، ثم اكتب «اتصال بالمورّد بعد العصر 20 د #هيوميرا» أو «بكرا الصبح مراجعة عرض السعر ساعة ونص @سامر». جرّب أيضًا تبويب «لصق رسالة».
- **المهام:** في «المهام» بدّل بين قائمة ولوحة وجدول (المفاتيح `L` و`B` و`C`). في اللوحة اسحب بطاقة، أو استعمل «انقل إلى…».
- **التركيز:** «ابدأ جلسة» تفتح وضع التركيز. «توقّف» تطلب ملاحظة الاستئناف.
- **الحمل الزائد:** اختر حالة «حمل زائد»، ثم «اقترح توزيعًا».

اختصارات: `N` التقاط، `1` اليوم، `2` المهام، `?` لماذا، `Esc` إغلاق.

## 8. نظام التصميم المقترح

### 8.1 الرموز: ما يبقى وما يُضاف

القاعدة: لا قيمة خارج المتغيرات. نُبقي `nasaq-theme.css` (الخط، والمسافات، والحركة) والأسماء الوظيفية في `themes/*.css` كما هي، ونضيف رموزًا قليلة لمفاهيم جديدة فقط.

| الرمز الجديد | الغرض | نَسَق فاتح | نَسَق داكن |
|---|---|---|---|
| `--now-bg` | خلفية «الآن» (العنصر المهيمن) | `var(--surface-1)` + حد `--primary` 2px في البداية | `var(--surface-2)` |
| `--period-current` | تظليل الفترة الحالية | `color-mix(in srgb,var(--primary) 6%,var(--surface-1))` | 10% |
| `--cap-fill` / `--cap-over` | مقياس السعة / التجاوز | `var(--primary)` / `var(--warning)` | كذلك |
| `--prayer-rule` | خط فاصل الصلاة | `var(--border-strong)` 1px منقّط | كذلك |
| `--chip-when` / `--chip-dur` / `--chip-proj` / `--chip-who` | رقائق التحليل | `--info-bg` / `--success-bg` / `--warning-bg` / `--surface-3` | النسخ الداكنة |
| `--privacy-*` | شارات الخصوصية | نص + أيقونة، لا لون وحده | — |

**الطباعة العربية:** النص 14–16px بارتفاع سطر 1.6–1.75، والأرقام `tabular-nums` في الأوقات والسعة. والتاريخان متجاوران بفاصل نصي حقيقي داخل `<bdi>`، مثل «الأربعاء 21 أكتوبر 2026 | 10 جمادى الأولى 1448 هـ». والهجري عبر `islamic-umalqura`، وما لا يدعمه المتصفح لا يُعرض تقريبيًا (كما في `fmtHijri`). [تقدير]: أم القرى قد يختلف بيوم عن الرؤية المحلية في بعض البلدان، فنضيف خيار «إزاحة يوم» في الإعدادات.

**اتجاه الزمن:** في RTL يسري الخط الزمني الأفقي من اليمين (الفجر) إلى اليسار (العشاء). والقوائم الرأسية من الأعلى للأسفل كما هي.

### 8.4 الحركة والصوت

- **ثلاث لحظات فقط:** الإنجاز (الدائرة تمتلئ مع نبضة اللمسة 420ms)، وانتقال الفترة (تلاشي التظليل 280ms)، وإغلاق اليوم (طيّ الفترات بالتتابع 40ms).
- **بلا حركة دائمة.** و`prefers-reduced-motion` يلغي كل شيء، ومثله مفتاح داخل التطبيق.
- **الصوت** مطفأ افتراضيًا: نقرة 60ms عند الإنجاز، ونغمة خافتة عند إغلاق اليوم. يُشغَّل بعد تفاعل فقط، ولا صوت عند الأذان أو الصلاة.

| تقويم المالك | Google Calendar | المزامنة | للمالك فقط، على الخادم |
| النص الملتقَط | **لا شيء** | — | التحليل على الجهاز |

**فرض الصلاحيات على الخادم:**

- كل طلب يحمل رمز جلسة. الجسر يحدد الدور والنطاق (المشاريع المسموحة)، ويُرجع **فقط** الحقول المسموحة. لا نعتمد على إخفاء الواجهة.
- **عدم تسريب الوجود:**
  - حساب «اليوم فقط» لا يتلقى في الاستجابة أي مفتاح يخص المشاريع أو التقويم أو المال، ولا عدّادًا لها.
  - طلب «فريق + مشاريع» لمشروع خارج نطاقه يُرجع «غير موجود» لا «ممنوع».
- **الطلبات:**
  - المرسِل يرى حالة طلبه فقط.
  - المستلم لا يرى مهام المرسِل الأخرى.
  - كل كتابة على ملف شخص آخر يُجريها الجسر، وتُسجَّل في سجل تدقيق.
- **الواجهة:** ما لا يحق لا يُرسم، فلا أيقونات معطلة. وشارة خصوصية نصية على كل بند مشترك.
- **الحفظ المحلي:**
  - الطابور دون اتصال في IndexedDB.
  - زر «امسح بيانات هذا الجهاز» في الإعدادات.
  - لا رموز دائمة في `localStorage` إن أمكن [تقدير: يُراجع مع تنفيذ الجلسة الحالي].
- **OWASP:** تحقق المدخلات على الجسر، وحماية من حقن الصيغ عند الكتابة إلى Sheets إن وُجدت، وحدود معدل لكل مستخدم [تقدير].

## 11. المخاطر والأسئلة المفتوحة وما لم نتحقق منه

### المخاطر

| الخطر | الاحتمال | الأثر | التخفيف |
|---|---|---|---|
| موقع ثابت لكل المستخدمين، فأوقات خاطئة لمن في مدينة أخرى | عالٍ | عالٍ | موقع لكل مستخدم، ووضع «بالساعة» |
| المسودة تُعتمد دون تفكير أو تُفقد الثقة | متوسط | عالٍ | 80% من السعة، وبنود قليلة، وقياس نسبة الإزالة |
| حدود Apps Script ونوشن | متوسط | متوسط | حساب على الجهاز، وطوابير، وتخزين مؤقت للاستحقاقات |
| انقطاع الاتصال وتعارضات المزامنة (لا Background Sync في Safari [ب]) | عالٍ [تقدير] | عالٍ | طابور محلي، ومزامنة عند الفتح والعودة، و«آخر كاتب يفوز» لكل حقل مع سجل |
| تضخم النطاق | عالٍ | عالٍ | MVP 6 بنود فقط، وكل موجة بمعيار قبول |
| إحساس بالمراقبة من الإحصاءات والطلبات | متوسط | متوسط | شخصية افتراضيًا، والمشاركة باختيار صاحبها |
| دقة الصوت باللهجة | عالٍ | منخفض (ميزة اختيارية) | النص أولًا، والصوت لاحقًا مع مراجعة النص |

### أسئلة مفتوحة للمالك

1. هل الفريق كله في المدينة نفسها؟ وهل يريد كل الأعضاء إيقاع الصلاة، أم يُعرض خيارًا لكل مستخدم؟
2. ما أيام أسبوع العمل الفعلية للمنظمة؟
3. ما قوالب الاستحقاقات لكل مانح؟ (تقرير سردي، أو مالي، أو 8+3، أو غيره)
4. من يعتمد الصرف، وبأي مهلة؟ وهل تكفي موافقة واحدة؟
5. هل نقبل إرسال نص المهام لمزوّد ذكاء اصطناعي عند الطلب، أم نبقى محليين بالكامل؟

### ما لم نستطع التحقق منه

- **الحدود والأسعار:**
  - الحدّ الدقيق لزمن تنفيذ Apps Script لحسابات Workspace (6 أو 30 دقيقة؛ المصادر متضاربة، والصفحة الرسمية لم تُفتح من بيئتنا).
  - أسعار Sunsama وMotion الحالية بدقة (المصادر متضاربة).
- **منتجات لم تُفحص:** ميزات MyWaqt وBarakah Tasks من وصف المتجر وصفحة الإطلاق فقط، لم نجربها. ودعم Trello وmonday الرسمي لـRTL. وكل منتجات القائمة «لم يُفحص» في 2.1.
- **دعم المنصات:**
  - دعم Web Share Target في iOS: [تقدير] غير مدعوم.
  - إمكانية Web Push من Apps Script.
- **قيود على الأدلة:**
  - لم نجد دراسة علمية على تصميم يحترم إيقاع اليوم الإسلامي في أدوات العمل. **ما نقترحه هنا فرضيات منتج، لا نتائج بحث.**
  - Deci وزملاؤه 1999، وRyan & Deci 2000، وJohnson & Goldstein 2003 مذكورة من المعرفة المرجعية، ولم نفتح نصوصها في هذه الجولة.

function extractFromMessage(text, base){
  const sender = ((text.match(/\]\s*([^:\n]{2,30}):/) || [])[1] || '').trim();
  const body = text.split(/\n+/).map(l => l.replace(/^\s*\[[^\]]*\]\s*/, '').replace(/^[^:\n]{1,30}:\s*/, '')).join(' ، ');
  const frags = body.split(/[.؟?!؛]|،|\s+و?كمان\s+|\s+وبعدين\s+/).map(f => f.trim()).filter(f => f.length > 6);
  const ASK = /(لازم|بدنا|بدي|بدكم|نرجو|الرجاء|يرجى|ياريت|ممكن|ترسل|أرسل|ارسل|ابعت|نبعت|بنبعت|تأكيد|أكد|اكد|جهز|راجع|اتصل|موعد|تسليم|توقيع|موقع)/;
  return frags.filter(f => ASK.test(normAr(f))).slice(0, 5).map((f, i) => {
    let g = f.replace(/^.*?(?:^|\s)بس\s+/, '').replace(/^(السلام عليكم|مرحبا|اهلا)\s*(أستاذ|استاذ)?\s*/, '');
    const waiting = /(بنبعت|نبعت|بنرسل|نرسل)/.test(normAr(g));
    g = g.replace(/(?:^|\s)(إن|ان) شاء الله/g, ' ').replace(/(بنبعتها|نبعتها|بنبعته|بنبعت|نبعت|بنرسلها)/g, ' ').replace(/^و(?=ال)/, '');
    const p = parseCapture(g, base);
    let title = p.title.replace(/^(بدنا|بدي|لازم|ياريت|نرجو|الرجاء|يرجى|ممكن)\s+/, '').replace(/^(ترسلولنا|ترسلوا لنا|ترسلوا|ترسلو|ترسل|تبعتولنا|ابعتولنا|ابعتوا|ابعت)\s+/, 'إرسال ').replace(/^و(?=ال)/, '');
    if(waiting) title = 'استلام ' + title;
    if(sender && !title.includes(sender)) title += ' | ' + sender;
    return Object.assign(p, {title: title.length > 70 ? title.slice(0, 68) + '…' : title, waiting, id: 'x' + i});
  });
}

function chime(kind){
  if(!S.sound) return;
  try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === 'close' ? [523, 659, 784] : [880];
    notes.forEach((f, i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = 'sine'; o.frequency.value = f;
      const t0 = audioCtx.currentTime + i * .09; g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.08, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + (kind === 'close' ? .5 : .12));
      o.connect(g).connect(audioCtx.destination); o.start(t0); o.stop(t0 + .6); });
  }catch(e){}
}

  $('#whyList').innerHTML = WHY.map((w, i) => `<article class="why-item" id="why-${w[0]}" data-on="${w[0] === key}"><h3><b>${i + 1}</b>${esc(w[1])}</h3><p>${esc(w[2])}</p><div class="src">الدليل: ${esc(w[3])} <span class="grade">${esc(w[4])}</span></div></article>`).join('');
  const t = key && $('#why-' + key); if(t) t.scrollIntoView({block: 'nearest'});
  $('#whyClose').focus({preventScroll: true});
}

/* ---------- الدراسة: عارض Markdown مصغّر ---------- */
function mdInline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (m, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  return s;
}
function renderMd(md){
  const L = md.replace(/<!--[\s\S]*?-->/g, '').split('\n'); let h = '', i = 0, n = 0; const toc = [];
  while(i < L.length){
    let l = L[i];
    if(!l.trim()){ i++; continue; }
    let m = l.match(/^(#{1,4})\s+(.*)$/);
    if(m){ const lv = m[1].length, id = 'sec-' + (n++); if(lv === 2) toc.push([id, m[2]]); h += `<h${lv} id="${id}">${mdInline(m[2])}</h${lv}>`; i++; continue; }
    if(/^---+\s*$/.test(l)){ h += '<hr>'; i++; continue; }
    if(l.startsWith('|') && L[i + 1] && /^\|[\s:|-]+\|\s*$/.test(L[i + 1])){
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = cells(l); i += 2; const rows = [];
      while(i < L.length && L[i].startsWith('|')){ rows.push(cells(L[i])); i++; }
      h += `<div class="tbl" tabindex="0" role="region" aria-label="جدول"><table><thead><tr>${head.map(c => `<th scope="col">${mdInline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${mdInline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      continue;
    }
    if(/^>\s?/.test(l)){ let q = []; while(i < L.length && /^>\s?/.test(L[i])){ q.push(L[i].replace(/^>\s?/, '')); i++; } h += `<blockquote>${mdInline(q.join(' '))}</blockquote>`; continue; }
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){
      const ordered = /^\s*\d+\./.test(l); let out = ordered ? '<ol>' : '<ul>', open = false, sub = null;
      while(i < L.length && /^\s*([-*]|\d+\.)\s+/.test(L[i])){
        const ind = L[i].match(/^\s*/)[0].length, txt = L[i].replace(/^\s*([-*]|\d+\.)\s+/, '');
        if(ind >= 2 && open){ if(!sub){ sub = /^\s*\d+\./.test(L[i]) ? 'ol' : 'ul'; out += `<${sub}>`; } out += `<li>${mdInline(txt)}</li>`; }
        else { if(sub){ out += `</${sub}>`; sub = null; } if(open) out += '</li>'; out += `<li>${mdInline(txt)}`; open = true; }
        i++;
      }
      if(sub) out += `</${sub}>`; if(open) out += '</li>'; h += out + (ordered ? '</ol>' : '</ul>'); continue;
    }
    let p = [l]; i++; while(i < L.length && L[i].trim() && !/^(#{1,4}\s|\||>|\s*([-*]|\d+\.)\s|---)/.test(L[i])){ p.push(L[i]); i++; }
    h += `<p>${mdInline(p.join(' '))}</p>`;
  }
  return {h, toc};
}
let studyDone = false;
function renderStudy(){
  if(studyDone) return; studyDone = true;
  const src = $('#study-md'); const {h, toc} = renderMd(src ? src.textContent : '');
  $('#doc').innerHTML = h;
  $('#toc').innerHTML = '<b style="display:block;margin-bottom:6px">المحتوى</b>' + toc.map(([id, t]) => `<a href="#${id}" data-toc="${id}">${esc(t.replace(/\*\*/g, ''))}</a>`).join('');
}

/* ---------- الإطار: المقياس والتحكّم ---------- */
function fit(){
  const st = $('#stage'), dv = $('#device'); if(!st || S.mode !== 'lab') return;
  const mob = S.device === 'mobile', W0 = mob ? 410 : 1440, H0 = mob ? 864 : 900;
  const avail = st.clientWidth; let sc = Math.min(1, avail / W0);
  if(mob) sc = Math.min(sc, Math.max(.62, (window.innerHeight - 150) / H0));
  S.scale = sc; dv.style.transform = `scale(${sc})`; st.style.height = Math.ceil(H0 * sc) + 'px';
  dv.style.insetInlineStart = Math.max(0, (avail - W0 * sc) / 2) + 'px';
}
function updateCaption(){
  const c = $('#stageCap'); if(!c) return;
  const acc = {owner: 'المالك', today: 'فريق: اليوم فقط', proj: 'فريق + مشاريع', none: 'حساب بلا وحدات'}[S.account];
  c.innerHTML = `<span>${S.device === 'mobile' ? 'جوال 390' : 'حاسوب 1440'} | ${acc} | الوقت المحاكى ${t12(D.now)}${D.ram ? ' | 3 رمضان 1448' : ''}</span><span>مقياس العرض ${Math.round(S.scale * 100)}%</span>`;
}
function setMode(m){
  S.mode = m; $$('[data-mode-btn]').forEach(b => b.setAttribute('aria-pressed', b.dataset.modeBtn === m));
  $('#lab').hidden = m !== 'lab'; $('#studyView').hidden = m !== 'study'; $('#labCtl').hidden = m !== 'lab';
  if(m === 'study') renderStudy(); else { fit(); }
  window.scrollTo(0, 0);
}
function bindChrome(){
  $$('[data-mode-btn]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.modeBtn)));
  $$('[data-dev]').forEach(b => b.addEventListener('click', () => { S.device = b.dataset.dev; $$('[data-dev]').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#device').dataset.device = S.device; savePrefs(); fit(); renderApp(); }));
  $('#account').addEventListener('change', e => { S.account = e.target.value; savePrefs(); S.view = 'today'; S.overlay = null; initData(); renderApp(); });
  $('#palette').addEventListener('change', e => { S.palette = e.target.value; savePrefs(); renderApp(); });
  $('#appTheme').addEventListener('change', e => { S.theme = e.target.value; savePrefs(); renderApp(); });
  $('#scenario').addEventListener('change', e => { S.scenario = e.target.value; S.overlay = null; S.open = {}; S.pauseOpen = false; S.dropFor = null; S.view = 'today'; initData(); renderApp(); });
  $('#whyBtn').addEventListener('click', () => toggleWhy());
  $('#soundBtn').addEventListener('click', e => { S.sound = !S.sound; e.currentTarget.setAttribute('aria-pressed', S.sound); e.currentTarget.lastChild.textContent = S.sound ? 'الصوت مفعّل' : 'الصوت'; if(S.sound) chime('done'); });
  $('#motionBtn').addEventListener('click', e => { S.reduced = !S.reduced; e.currentTarget.setAttribute('aria-pressed', S.reduced); renderApp(); });
  $('#whyClose').addEventListener('click', () => { $('#why').hidden = true; });
  $('#toc').addEventListener('click', e => { const a = e.target.closest('[data-toc]'); if(!a) return; e.preventDefault(); const t = document.getElementById(a.dataset.toc); if(t) t.scrollIntoView({behavior: 'smooth', block: 'start'}); });
  window.addEventListener('resize', () => { fit(); updateCaption(); });
}
function toggleWhy(force){ S.why = force != null ? force : !S.why; $('#whyBtn').setAttribute('aria-pressed', S.why); if(S.why) openWhy(null); else $('#why').hidden = true; renderApp(); }
function bindApp(){
  const app = $('#app');
  app.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if(!b || !app.contains(b)) return;
    if(b.tagName === 'INPUT') { const [a, x] = b.dataset.a.split(':'); handle(a, x, null, b); return; }
    e.preventDefault(); const parts = b.dataset.a.split(':'); handle(parts[0], parts[1], parts.slice(2).join(':'), b); });
  app.addEventListener('input', e => { if(e.target.id === 'capIn') updateCapture(); if(e.target.id === 'pasteIn') S.pasteText = e.target.value; });
  app.addEventListener('keydown', e => {
    if(e.target.id === 'capIn' && e.key === 'Enter'){ e.preventDefault(); handle('cadd'); }
    if(e.key === 'Tab'){ const dlg = $('.layer [role="dialog"], .layer [role="menu"]', app); if(dlg){ const f = $$('button,input,textarea,select,[tabindex="0"]', dlg).filter(x => !x.disabled && x.offsetParent !== null); if(!f.length) return;
      const first = f[0], last = f[f.length - 1]; if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); } else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); } } }
    if(S.overlay === 'menu' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){ const items = $$('.menu button', app); const i = items.indexOf(document.activeElement); if(items.length){ e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); } }
  });
  /* السحب والإفلات في اللوحة (حاسوب) — والبديل «انقل إلى…» في كل بطاقة */
  app.addEventListener('dragstart', e => { const c = e.target.closest('.card'); if(!c) return; e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging'); });
  app.addEventListener('dragend', e => { const c = e.target.closest('.card'); if(c) c.classList.remove('dragging'); $$('.bcol', app).forEach(x => x.removeAttribute('data-drop')); });
  app.addEventListener('dragover', e => { const col = e.target.closest('.bcol'); if(!col) return; e.preventDefault(); $$('.bcol', app).forEach(x => x.toggleAttribute('data-drop', x === col)); if(col) col.dataset.drop = 'true'; });
  app.addEventListener('drop', e => { const col = e.target.closest('.bcol'); if(!col) return; e.preventDefault(); const id = e.dataTransfer.getData('text/plain'); if(id){ moveBoard(id, col.dataset.col); renderApp(); } });
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
    if(e.key === 'Escape'){ if(S.overlay){ S.overlay = null; S.menu = null; renderApp(); } else if(!$('#why').hidden){ $('#why').hidden = true; } return; }
    if(typing || e.metaKey || e.ctrlKey || e.altKey || S.mode !== 'lab' || D.none) return;
    if(e.code === 'KeyN'){ e.preventDefault(); handle('capture'); }
    else if(e.code === 'Digit1'){ handle('nav', 'today'); }
    else if(e.code === 'Digit2'){ handle('nav', 'tasks'); }
    else if(S.view === 'tasks' && ['KeyL', 'KeyB', 'KeyC'].includes(e.code)){ handle('tview', {KeyL: 'list', KeyB: 'board', KeyC: 'cal'}[e.code]); }
    else if(e.key === '?' || (e.code === 'Slash' && e.shiftKey)){ e.preventDefault(); toggleWhy(); }
  });
}
function init(){
  $('#account').value = S.account; $('#palette').value = S.palette; $('#appTheme').value = S.theme;
  $$('[data-dev]').forEach(x => x.setAttribute('aria-pressed', x.dataset.dev === S.device)); $('#device').dataset.device = S.device;
  if(window.innerWidth < 760){ const d = $('#labCtl'); if(d) d.open = false;
    let saved = null; try{ saved = JSON.parse(localStorage.getItem('nasaq-lab') || '{}').device; }catch(e){}
    if(!saved){ S.device = 'mobile'; $$('[data-dev]').forEach(x => x.setAttribute('aria-pressed', x.dataset.dev === 'mobile')); $('#device').dataset.device = 'mobile'; } }
  initData(); bindChrome(); bindApp(); fit(); renderApp();
  const hash = (location.hash || '').slice(1); if(hash === 'study') setMode('study');
}
document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', init) : init();

</script>
